
<h2 class="sr-only">Webcam tester — test your camera and microphone in the browser</h2>
<style>
:root { --cam-bg: #0a0a0f; --cam-border: #1e1e2e; --accent: #00e5b3; --accent2: #7c5cfc; --text: #e8e8f0; --muted: #6b6b85; --card-bg: #12121a; --success: #00e5b3; --warn: #f59e0b; --danger: #ef4444; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body, .wrap { background: transparent; }
.wrap { font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text); padding: 1rem 0; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
.logo { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: flex; align-items: center; justify-content: center; }
.logo i { font-size: 20px; color: #fff; }
.title { font-size: 18px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
.subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cam-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #08080f; border-radius: 12px; border: 1.5px solid var(--cam-border); overflow: hidden; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; }
#videoEl { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
.idle-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.idle-icon { width: 64px; height: 64px; border-radius: 50%; background: #1a1a26; border: 1.5px solid #2a2a3e; display: flex; align-items: center; justify-content: center; }
.idle-icon i { font-size: 28px; color: var(--muted); }
.idle-text { font-size: 13px; color: var(--muted); }
.overlay-info { position: absolute; top: 10px; left: 12px; display: flex; gap: 8px; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 500; letter-spacing: 0.05em; backdrop-filter: blur(4px); }
.badge-live { background: rgba(0,229,179,0.15); color: var(--accent); border: 0.5px solid rgba(0,229,179,0.3); }
.badge-dev { background: rgba(124,92,252,0.15); color: #a07eff; border: 0.5px solid rgba(124,92,252,0.3); }
.rec-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 4px; animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.fps-badge { position: absolute; top: 10px; right: 12px; font-size: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.5); color: var(--muted); border: 0.5px solid #2a2a3e; }
.canvas-hidden { display: none; }
.controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
.btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; border: 1.5px solid; transition: all 0.15s; letter-spacing: 0.02em; }
.btn-primary { background: rgba(0,229,179,0.1); color: var(--accent); border-color: rgba(0,229,179,0.3); }
.btn-primary:hover { background: rgba(0,229,179,0.2); border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.1); color: var(--danger); border-color: rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-neutral { background: #12121a; color: var(--muted); border-color: #2a2a3e; }
.btn-neutral:hover { color: var(--text); border-color: #3a3a55; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.snap-btn { background: rgba(124,92,252,0.1); color: #a07eff; border-color: rgba(124,92,252,0.3); }
.snap-btn:hover { background: rgba(124,92,252,0.2); }
.device-select { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 12px; background: #12121a; color: var(--text); border: 1.5px solid #2a2a3e; cursor: pointer; }
.device-select:focus { outline: none; border-color: var(--accent2); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 1rem; }
.stat-card { background: #0e0e17; border: 1px solid #1e1e2e; border-radius: 10px; padding: 12px 14px; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.stat-value { font-size: 16px; font-weight: 500; color: var(--text); }
.stat-value.good { color: var(--accent); }
.stat-value.warn { color: var(--warn); }
.stat-value.bad { color: var(--danger); }
.snap-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 1rem; min-height: 0; }
.snap-row:empty { display: none; }
.snap-thumb { width: 80px; height: 52px; border-radius: 6px; object-fit: cover; border: 1.5px solid #2a2a3e; flex-shrink: 0; cursor: pointer; transition: border-color 0.15s; }
.snap-thumb:hover { border-color: var(--accent2); }
.status-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); padding: 8px 12px; background: #0e0e17; border-radius: 8px; border: 1px solid #1e1e2e; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-idle { background: var(--muted); }
.dot-active { background: var(--accent); animation: pulse 1.4s ease infinite; }
.dot-error { background: var(--danger); }
.resolution-tag { margin-left: auto; font-size: 10px; background: #1a1a26; padding: 2px 8px; border-radius: 4px; color: var(--accent2); }
</style>

<div class="wrap">
  <div class="header">
    <div class="logo"><i class="ti ti-camera" aria-hidden="true"></i></div>
    <div>
      <div class="title">webcam test</div>
      <div class="subtitle">supports internal & external cameras</div>
    </div>
  </div>

  <div class="cam-container" id="camBox">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="snapCanvas" class="canvas-hidden"></canvas>
    <div class="idle-screen" id="idleScreen">
      <div class="idle-icon"><i class="ti ti-camera-off" aria-hidden="true"></i></div>
      <div class="idle-text">klik "start camera" untuk mulai</div>
    </div>
    <div class="overlay-info" id="overlayInfo" style="display:none">
      <span class="badge badge-live"><span class="rec-dot"></span>LIVE</span>
      <span class="badge badge-dev" id="deviceNameBadge">CAM</span>
    </div>
    <div class="fps-badge" id="fpsBadge" style="display:none">-- fps</div>
  </div>

  <div class="controls">
    <select class="device-select" id="deviceSelect">
      <option value="">-- pilih kamera --</option>
    </select>
    <button class="btn btn-primary" id="startBtn" onclick="startCamera()">
      <i class="ti ti-player-play" aria-hidden="true"></i> start camera
    </button>
    <button class="btn btn-danger" id="stopBtn" onclick="stopCamera()" disabled>
      <i class="ti ti-player-stop" aria-hidden="true"></i> stop
    </button>
    <button class="btn snap-btn" id="snapBtn" onclick="takeSnapshot()" disabled>
      <i class="ti ti-camera" aria-hidden="true"></i> snapshot
    </button>
    <button class="btn btn-neutral" onclick="refreshDevices()">
      <i class="ti ti-refresh" aria-hidden="true"></i>
    </button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">resolusi</div>
      <div class="stat-value" id="statRes">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">frame rate</div>
      <div class="stat-value" id="statFps">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">aspek rasio</div>
      <div class="stat-value" id="statAr">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">status</div>
      <div class="stat-value" id="statStatus">offline</div>
    </div>
  </div>

  <div class="snap-row" id="snapRow"></div>

  <div class="status-bar">
    <div class="status-dot dot-idle" id="statusDot"></div>
    <span id="statusMsg">menunggu kamera...</span>
    <span class="resolution-tag" id="resoTag">belum aktif</span>
  </div>
</div>

<script>
let stream = null;
let fpsInterval = null;
let lastFrameTime = 0;
let frameCount = 0;
let currentFps = 0;
const video = document.getElementById('videoEl');
const snapCanvas = document.getElementById('snapCanvas');
const snapRow = document.getElementById('snapRow');

async function refreshDevices() {
  try {
    await navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(s => s.getTracks().forEach(t => t.stop())).catch(()=>{});
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    const sel = document.getElementById('deviceSelect');
    sel.innerHTML = '<option value="">-- pilih kamera --</option>';
    cams.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.text = d.label || `Kamera ${i+1}`;
      sel.appendChild(opt);
    });
    setStatus(cams.length > 0 ? `${cams.length} kamera ditemukan` : 'tidak ada kamera terdeteksi', cams.length > 0 ? 'idle' : 'error');
    document.getElementById('resoTag').textContent = `${cams.length} kamera`;
  } catch(e) {
    setStatus('akses kamera ditolak — izinkan dulu di browser', 'error');
  }
}

async function startCamera() {
  const sel = document.getElementById('deviceSelect');
  const deviceId = sel.value;
  const constraints = { video: deviceId ? { deviceId: {exact: deviceId}, width:{ideal:1920}, height:{ideal:1080} } : { width:{ideal:1920}, height:{ideal:1080} }, audio: false };
  try {
    if(stream) stopCamera();
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('overlayInfo').style.display = 'flex';
    document.getElementById('fpsBadge').style.display = 'block';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('snapBtn').disabled = false;
    video.onloadedmetadata = () => {
      const w = video.videoWidth, h = video.videoHeight;
      document.getElementById('statRes').textContent = `${w}×${h}`;
      document.getElementById('statRes').className = 'stat-value good';
      document.getElementById('statAr').textContent = gcd_ar(w,h);
      document.getElementById('resoTag').textContent = `${w}×${h}`;
      snapCanvas.width = w;
      snapCanvas.height = h;
    };
    const track = stream.getVideoTracks()[0];
    const label = track.label || 'Unknown';
    document.getElementById('deviceNameBadge').textContent = label.length > 20 ? label.substring(0,18)+'…' : label;
    setStatus(`streaming: ${label}`, 'active');
    document.getElementById('statStatus').textContent = 'live';
    document.getElementById('statStatus').className = 'stat-value good';
    startFpsCounter();
    await refreshDevices();
  } catch(e) {
    setStatus(`error: ${e.message}`, 'error');
    document.getElementById('statStatus').textContent = 'error';
    document.getElementById('statStatus').className = 'stat-value bad';
  }
}

function stopCamera() {
  if(stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  video.srcObject = null;
  document.getElementById('idleScreen').style.display = 'flex';
  document.getElementById('overlayInfo').style.display = 'none';
  document.getElementById('fpsBadge').style.display = 'none';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('snapBtn').disabled = true;
  document.getElementById('statRes').textContent = '—';
  document.getElementById('statRes').className = 'stat-value';
  document.getElementById('statFps').textContent = '—';
  document.getElementById('statFps').className = 'stat-value';
  document.getElementById('statAr').textContent = '—';
  document.getElementById('statStatus').textContent = 'offline';
  document.getElementById('statStatus').className = 'stat-value';
  document.getElementById('resoTag').textContent = 'belum aktif';
  if(fpsInterval) { cancelAnimationFrame(fpsInterval); fpsInterval = null; }
  setStatus('kamera dimatikan', 'idle');
}

function startFpsCounter() {
  frameCount = 0;
  let lastCheck = performance.now();
  function loop(now) {
    frameCount++;
    if(now - lastCheck >= 1000) {
      currentFps = Math.round(frameCount * 1000 / (now - lastCheck));
      frameCount = 0;
      lastCheck = now;
      document.getElementById('fpsBadge').textContent = `${currentFps} fps`;
      const fpsEl = document.getElementById('statFps');
      fpsEl.textContent = `${currentFps} fps`;
      fpsEl.className = 'stat-value ' + (currentFps >= 24 ? 'good' : currentFps >= 15 ? 'warn' : 'bad');
    }
    fpsInterval = requestAnimationFrame(loop);
  }
  fpsInterval = requestAnimationFrame(loop);
}

function takeSnapshot() {
  if(!stream || !video.videoWidth) return;
  const ctx = snapCanvas.getContext('2d');
  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(video, -snapCanvas.width, 0, snapCanvas.width, snapCanvas.height);
  ctx.restore();
  const url = snapCanvas.toDataURL('image/jpeg', 0.92);
  const img = document.createElement('img');
  img.className = 'snap-thumb';
  img.src = url;
  img.title = `snapshot ${new Date().toLocaleTimeString()}`;
  img.onclick = () => { const a=document.createElement('a'); a.href=url; a.download=`webcam-snap-${Date.now()}.jpg`; a.click(); };
  snapRow.insertBefore(img, snapRow.firstChild);
  if(snapRow.children.length > 6) snapRow.removeChild(snapRow.lastChild);
}

function gcd_ar(w,h) {
  function gcd(a,b){return b===0?a:gcd(b,a%b);}
  const g = gcd(w,h);
  return `${w/g}:${h/g}`;
}

function setStatus(msg, type) {
  document.getElementById('statusMsg').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + (type==='active'?'dot-active':type==='error'?'dot-error':'dot-idle');
}

navigator.mediaDevices && navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener('devicechange', refreshDevices);
refreshDevices();
</script>
