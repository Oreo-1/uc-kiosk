<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <title>Scan NFC</title>

    <style>
      body {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .wrapper {
        width: 400px;
        text-align: center;
        padding: 40px 20px;
        position: relative;
      }

      .top-left {
        position: absolute;
        top: -20px;
        left: -40px;
        font-size: 22px;
        font-weight: 700;
        color: #994345;
        font-style: italic;
        letter-spacing: -1.2px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #1a1a1a;
      }

      p {
        color: #6b7280;
        margin-bottom: 30px;
      }

      .nfc-box {
        width: 420px;
        height: 420px;
        margin: 0 auto 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button {
        background: #f97316;
        color: white;
        border: none;
        padding: 14px 20px;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }

      .status {
        margin-top: 20px;
        font-size: 14px;
        color: #374151;
      }

      /* Style tambahan untuk ID User di bawah */
      .debug-id {
        margin-top: 40px;
        font-size: 11px;
        color: #9ca3af;
        font-family: monospace;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .overlay-content {
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        width: 280px;
      }

      .checkmark {
        width: 80px;
        height: 80px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #22c55e;
        color: white;
        font-size: 42px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div class="top-left">Moodbites</div>

      <h1>Scan NFC</h1>
      <p>Tempelkan kartu pada alat scan untuk lanjut</p>

      <div class="nfc-box">
        <lottie-player
          src="assets/nfc.json"
          background="transparent"
          speed="1"
          style="width: 100%; height: 100%"
          loop
          autoplay
        >
        </lottie-player>
      </div>

      <button id="scanBtn">Batalkan Scan</button>
      <div class="status" id="status">Status: Menghubungkan ke scanner...</div>
      
      <!-- Container untuk User ID (Hapus Nanti) -->
      <div id="debugIdDisplay" class="debug-id"></div>
    </div>

    <div id="successOverlay" class="overlay">
      <div class="overlay-content">
        <div class="checkmark">✓</div>
        <h2>NFC Berhasil</h2>
        <p>Mengalihkan ke kamera...</p>
      </div>
    </div>

    <script>
      const btn = document.getElementById("scanBtn");
      const statusText = document.getElementById("status");
      const debugText = document.getElementById("debugIdDisplay");
      const API_URL = "http://10.1.50.36:6767/wait-user";
      
      let isScanning = true;
      let controller = new AbortController();

      async function startLongPolling() {
        if (!isScanning) return;

        statusText.textContent = "Status: Menunggu kartu ditempel...";

        try {
          const timeoutId = setTimeout(() => controller.abort(), 30000);

          const response = await fetch(API_URL, {
            method: 'GET',
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (response.ok) {
            const data = await response.json();
            
            // PERBAIKAN DI SINI: Mencocokkan dengan JSON {"success":true, "userId": "..."}
            if (data && data.success === true && data.userId) {
              handleSuccess(data.userId);
            } else {
              // Jika sukses tapi data tidak valid atau success: false, ulangi polling
              console.log("Data tidak valid atau success: false", data);
              startLongPolling();
            }
          } else {
            setTimeout(startLongPolling, 1000);
          }

        } catch (error) {
          if (error.name === 'AbortError') {
            console.log("Timeout, mengulang...");
            controller = new AbortController();
            startLongPolling();
          } else {
            console.error("Koneksi gagal:", error);
            statusText.textContent = "⚠️ Gagal terhubung ke server (10.1.50.36)...";
            setTimeout(startLongPolling, 3000); 
          }
        }
      }

      function handleSuccess(userId) {
        isScanning = false;
        
        // Simpan User ID ke Local Storage
        localStorage.setItem("user_id", userId);
        
        // Tampilkan User ID di bagian bawah (Hapus Nanti)
        // debugText.textContent = `User ID: ${userId} (hapus nanti)`;

        // Efek getar
        navigator.vibrate?.(200);

        // Tampilkan overlay sukses
        document.getElementById("successOverlay").style.display = "flex";
        
        setTimeout(() => {
          window.location.href = "camera.html";
        }, 2000);
      }

      btn.addEventListener("click", () => {
        isScanning = false;
        controller.abort();
        window.history.back();
      });

      window.addEventListener("load", () => {
        startLongPolling();
      });
    </script>
  </body>
</html>
