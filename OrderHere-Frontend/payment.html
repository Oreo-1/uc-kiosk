<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran - Food Order</title>
  <style>
    /* Global Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--primary-gradient); /* Pastikan var ini ada di main.css */
    }

    .page {
      width: 900px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 48px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      background: #f3f4f6;
      border-radius: 24px;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    /* ── Header ── */
    .card-title {
      font-size: 32px;
      font-weight: 800;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 8px;
    }

    .card-antrian {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── Illustrations ── */
    .tunai-img {
      width: 280px;
      height: 220px;
      object-fit: contain;
      margin-bottom: 28px;
    }

    .qris-wrap {
      width: 100%;
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      overflow: hidden;
      max-width: 300px;
      padding: 10px;
    }

    .qris-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Summary ── */
    .summary {
      width: 100%;
      background: #e5e7eb;
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-col { display: flex; flex-direction: column; gap: 4px; }
    .summary-label { font-size: 13px; color: #6b7280; font-weight: 500; }
    .summary-value { font-size: 16px; font-weight: 800; color: #1a1a1a; }
    .summary-col.right { text-align: right; }

    /* ── Action Row (Buttons Container) ── */
    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
    }

    .ubah-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      transition: opacity 0.15s;
    }
    .ubah-btn:hover { opacity: 0.75; }

    .ok-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 40px;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: transform 0.1s, background 0.2s;
    }
    .ok-btn:hover { background: #333; }
    .ok-btn:active { transform: scale(0.96); }

  </style>
  <link rel="stylesheet" href="main.css" />
  <script src="config.js"></script>
</head>
<body>

<div class="page">
  <div class="card">
    <p class="card-title" id="card-title">Memuat...</p>
    <p class="card-subtitle" id="card-subtitle">—</p>
    <p class="card-antrian" id="card-antrian">No. Antrian : —</p>

    <!-- Visual Pembayaran -->
    <img class="tunai-img" id="tunai-img"
      src="assets/review-order/tunai-illustration.svg"
      alt="Tunai" style="display:none;">

    <div class="qris-wrap" id="qris-wrap" style="display:none;">
      <img src="assets/payment/qris.png" alt="QRIS" 
           onerror="this.parentElement.innerHTML='<p>QRIS Image</p>'">
    </div>

    <!-- Summary Box -->
    <div class="summary">
      <div class="summary-col">
        <span class="summary-label">Pesanan</span>
        <span class="summary-value" id="summary-items">—</span>
      </div>
      <div class="summary-col right">
        <span class="summary-label">Total Bayar</span>
        <span class="summary-value" id="summary-total">Rp. 0</span>
      </div>
    </div>
  </div>

  <!-- Tombol Aksi -->
  <div class="action-row">
    <button class="ubah-btn" onclick="window.history.back()">
      ◀ Ubah Opsi Pembayaran
    </button>

    <button class="ok-btn" onclick="goToIndex()">
      Selesai & OK &nbsp;✔
    </button>
  </div>
</div>

<script>
  // 1. Ambil Data dari Session
  const method = sessionStorage.getItem('paymentMethod') || 'TUNAI';
  const order = JSON.parse(sessionStorage.getItem('order') || '{}');
  const antrian = sessionStorage.getItem('antrian') || '—';

  // 2. Update Tampilan Berdasarkan Metode
  if (method.toUpperCase() === 'QRIS') {
    document.getElementById('card-title').textContent = 'Scan QRIS';
    document.getElementById('card-subtitle').textContent = '*Scan melalui aplikasi bank atau e-wallet';
    document.getElementById('qris-wrap').style.display = 'flex';
    document.getElementById('tunai-img').style.display = 'none';
  } else {
    document.getElementById('card-title').textContent = 'Bayar Tunai';
    document.getElementById('card-subtitle').textContent = '*Silakan menuju kasir untuk pembayaran';
    document.getElementById('tunai-img').style.display = 'block';
    document.getElementById('qris-wrap').style.display = 'none';
  }

  document.getElementById('card-antrian').textContent = `No. Antrian : ${antrian}`;

  // 3. Format Rupiah
  function formatRp(n) {
    return 'Rp. ' + (n || 0).toLocaleString('id-ID');
  }

  // 4. Update Summary
  // Gunakan total_price (sesuai field dari Laravel Controller) atau total_amount
  const total = order.total_price || order.total_amount || 0;
  
  let itemLabel = 'Item Terpilih';
  if (order.foods && order.foods.length > 0) {
    const firstItem = order.foods[0];
    const name = firstItem.name || 'Makanan';
    
    if (order.foods.length === 1) {
      itemLabel = firstItem.pivot ? `${name} x${firstItem.pivot.quantity}` : name;
    } else {
      itemLabel = `${name} & ${order.foods.length - 1} lainnya`;
    }
  }

  document.getElementById('summary-items').textContent = itemLabel;
  document.getElementById('summary-total').textContent = formatRp(total);

  // 5. Fungsi Navigasi
  function goToIndex() {
    // Hapus data temporary agar tidak tertumpuk saat pesan baru
    sessionStorage.removeItem('order');
    sessionStorage.removeItem('antrian');
    sessionStorage.removeItem('paymentMethod');
    
    // Kembali ke menu utama
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
