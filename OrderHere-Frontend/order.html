<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: "Montserrat", sans-serif;
        background: #cccccc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: stretch;
        overflow: hidden;
      }

      .page {
        width: 900px;
        height: 100vh;
        display: flex;
        background: #fff;
        position: relative;
        overflow: hidden;
      }

      .main {
        height: 100vh;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 32px 24px 0;
        overflow: hidden;
      }

      .vendor-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 28px;
        flex-shrink: 0;
      }

      .vendor-card {
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        user-select: none;
      }
      .vendor-card:hover {
        border-color: #f97316;
        box-shadow: 0 4px 14px rgba(249, 115, 22, 0.12);
      }
      .vendor-card.active {
        background: var(--primary-gradient);
        box-shadow: 0 6px 20px rgba(249, 115, 22, 0.3);
      }
      .vendor-card.active .vendor-name {
        color: #fff;
      }

      .vendor-logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .vendor-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .vendor-name {
        font-size: 14px;
        font-weight: 700;
        color: #1a1a1a;
        text-align: center;
      }

      .vendor-header {
        flex-shrink: 0;
        margin-bottom: 16px;
      }
      .vendor-title {
        font-size: 26px;
        font-weight: 800;
        color: #1a1a1a;
        margin-bottom: 14px;
      }

      /* STYLE UNTUK TAB FILTER AGAR BISA SCROLL SAMPING */
      .filter-row {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 8px;
      }
      .filter-tag {
        padding: 6px 18px;
        border-radius: 10px;
        border: 2px solid #e5e7eb;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        cursor: pointer;
        transition: all 0.15s;
        background: #fff;
        flex-shrink: 0;
        text-transform: capitalize;
      }
      .filter-tag:hover {
        border-color: #f97316;
        color: #f97316;
      }
      .filter-tag.active {
        background: #f97316;
        border-color: #f97316;
        color: #fff;
      }

      .menu-grid-wrapper {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .menu-card {
        border: 1.5px solid #e5e7eb;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        transition:
          box-shadow 0.2s,
          transform 0.1s;
        background: #fff;
      }
      .menu-card:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        transform: translateY(-2px);
      }
      .menu-card.sold-out {
        opacity: 0.75;
        cursor: not-allowed;
        pointer-events: none;
      }

      .menu-img-wrap {
        position: relative;
        width: 100%;
        height: 140px;
        background: #f3f4f6;
        overflow: hidden;
      }
      .menu-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .menu-img-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        background: #f9fafb;
      }
      .sold-out-badge {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .menu-info {
        padding: 12px 14px 14px;
      }
      .menu-name {
        font-size: 14px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 4px;
        text-align: center;
      }
      .menu-price {
        font-size: 13px;
        color: #666;
        text-align: center;
      }

      .order-panel {
        width: 220px;
        flex-shrink: 0;
        background: #1e2535;
        display: flex;
        flex-direction: column;
        padding: 32px 16px 24px;
        color: #fff;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .order-header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .order-title {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.1;
      }
      .order-count-badge {
        background: #f97316;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        margin-top: 2px;
        display: none;
      }
      .order-type-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #9ca3af;
        margin-bottom: 20px;
      }

      .order-items {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .cart-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
        color: #4b5563;
      }
      .cart-empty-icon {
        font-size: 52px;
        opacity: 0.4;
      }
      .cart-empty-text {
        font-size: 13px;
        font-weight: 600;
      }

      .cart-item {
        background: #273044;
        border-radius: 10px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        animation: slideIn 0.25s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(12px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .cart-item-top {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .cart-item-img {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: #374151;
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .cart-item-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cart-item-info {
        flex: 1;
        min-width: 0;
      }
      .cart-item-name {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        line-height: 1.3;
      }
      .cart-item-price {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 2px;
      }
      .cart-item-notes {
        font-size: 10px;
        color: #6b7280;
        margin-top: 2px;
        line-height: 1.4;
      }
      .cart-item-delete {
        background: none;
        border: none;
        cursor: pointer;
        color: #4b5563;
        font-size: 14px;
        padding: 2px;
        transition: color 0.15s;
        flex-shrink: 0;
      }
      .cart-item-delete:hover {
        color: #ef4444;
      }

      .cart-qty-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cart-qty-btn {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid #4b5563;
        background: none;
        color: #9ca3af;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .cart-qty-btn:hover {
        border-color: #f97316;
        color: #f97316;
      }
      .cart-qty-val {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        min-width: 16px;
        text-align: center;
      }

      .order-footer {
        border-top: 1px solid #374151;
        padding-top: 16px;
        margin-top: 12px;
      }
      .order-total-label {
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 4px;
        text-align: center;
      }
      .order-total-amount {
        font-size: 20px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 4px;
      }
      .order-est {
        font-size: 10px;
        color: #6b7280;
        text-align: center;
        margin-bottom: 14px;
      }

      .btn-pesan {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: var(--primary-gradient);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn-pesan:hover {
        opacity: 0.9;
      }
      .btn-pesan:active {
        transform: scale(0.97);
      }
      .btn-pesan:disabled {
        background: #374151;
        color: #4b5563;
        cursor: not-allowed;
      }

      .sheet-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .sheet-overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      .bottom-sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #fff;
        border-radius: 20px 20px 0 0;
        z-index: 101;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        max-height: 92%;
        display: flex;
        flex-direction: column;
      }
      .bottom-sheet.open {
        transform: translateY(0);
      }

      .sheet-handle {
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: #d1d5db;
        margin: 12px auto 0;
        flex-shrink: 0;
      }

      .sheet-body {
        overflow-y: auto;
        padding: 20px 24px 0;
        flex: 1;
      }

      .sheet-img {
        width: 100%;
        height: 200px;
        border-radius: 14px;
        object-fit: cover;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .sheet-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .sheet-name {
        font-size: 22px;
        font-weight: 800;
        color: #1a1a1a;
        text-align: center;
      }
      .sheet-price {
        font-size: 18px;
        font-weight: 700;
        color: #f97316;
        text-align: center;
        margin-top: 4px;
      }
      .sheet-est-text {
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
        margin-top: 4px;
        margin-bottom: 16px;
      }

      .sheet-qty-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .sheet-qty-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #e5e7eb;
        background: #fff;
        font-size: 20px;
        font-weight: 700;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .sheet-qty-btn:hover {
        border-color: #f97316;
        color: #f97316;
      }
      .sheet-qty-val {
        font-size: 20px;
        font-weight: 800;
        min-width: 28px;
        text-align: center;
      }

      .sheet-section {
        margin-bottom: 16px;
      }
      .sheet-section-title {
        font-size: 14px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 10px;
      }
      .sheet-options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .sheet-options-grid.single {
        grid-template-columns: 1fr;
      }

      .sheet-option {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        user-select: none;
      }
      .sheet-option:hover {
        border-color: #f97316;
      }
      .sheet-option.selected {
        border-color: #f97316;
        background: #fff7ed;
        color: #f97316;
      }

      .sheet-option-radio {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #d1d5db;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sheet-option.selected .sheet-option-radio {
        border-color: #f97316;
      }
      .sheet-option-radio-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f97316;
        display: none;
      }
      .sheet-option.selected .sheet-option-radio-dot {
        display: block;
      }

      .sheet-option-checkbox {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 2px solid #d1d5db;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sheet-option.selected .sheet-option-checkbox {
        border-color: #f97316;
        background: #f97316;
      }
      .sheet-option-checkmark {
        display: none;
        color: #fff;
        font-size: 10px;
        font-weight: 900;
      }
      .sheet-option.selected .sheet-option-checkmark {
        display: block;
      }

      .sheet-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #e5e7eb;
        border-radius: 10px;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        resize: none;
        outline: none;
        transition: border-color 0.15s;
      }

      .sheet-textarea:focus {
        border-color: #f97316;
      }

      .sheet-textarea::placeholder {
        color: #9ca3af;
        font-weight: 400;
      }

      .sheet-footer {
        padding: 16px 24px 24px;
        flex-shrink: 0;
        background: #fff;
      }
      .btn-tambah {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: var(--primary-gradient);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.03em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn-tambah:hover {
        opacity: 0.9;
      }
      .btn-tambah:active {
        transform: scale(0.98);
      }
    </style>
    <link rel="stylesheet" href="main.css" />
    <script src="config.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="main">
        <div class="vendor-row" id="vendor-container">
          <!-- Vendor akan di-render otomatis oleh JavaScript -->
        </div>

        <div class="vendor-header">
          <h2 class="vendor-title" id="vendor-title">Loading...</h2>
          <div class="filter-row" id="filter-row">
            <!-- Filter chips akan di-render otomatis -->
          </div>
        </div>

        <div class="menu-grid-wrapper">
          <div class="menu-grid" id="menu-grid">
            <!-- Menu dirender otomatis oleh JavaScript -->
          </div>
        </div>
      </div>

      <div class="order-panel">
        <div class="order-header-row">
          <p class="order-title">My<br />Order</p>
          <span class="order-count-badge" id="order-count">0</span>
        </div>
        <p class="order-type-badge" id="order-type-badge">TAKEAWAY</p>

        <div class="order-items" id="order-items">
          <div class="cart-empty" id="cart-empty">
            <img
              src="assets/order-page/hantu.svg"
              onerror="
                this.outerHTML = '<span class=\'cart-empty-icon\'>👻</span>'
              "
              alt=""
            />
            <span class="cart-empty-text">Cart Kosong..</span>
          </div>
        </div>

        <div class="order-footer">
          <p class="order-total-label">Total</p>
          <p class="order-total-amount" id="order-total">Rp. 0</p>
          <p class="order-est" id="order-est"></p>
          <button
            class="btn-pesan"
            id="btn-pesan"
            disabled
            onclick="handlePesan()"
          >
            Pesan
          </button>
        </div>
      </div>

      <div
        class="sheet-overlay"
        id="sheet-overlay"
        onclick="closeSheet()"
      ></div>

      <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-body">
          <div class="sheet-img" id="sheet-img">🍽️</div>
          <p class="sheet-name" id="sheet-name"></p>
          <p class="sheet-price" id="sheet-price"></p>
          <p class="sheet-est-text" id="sheet-est-text"></p>

          <div class="sheet-qty-row">
            <button class="sheet-qty-btn" onclick="changeSheetQty(-1)">
              −
            </button>
            <span class="sheet-qty-val" id="sheet-qty">1</span>
            <button class="sheet-qty-btn" onclick="changeSheetQty(1)">+</button>
          </div>

          <div class="sheet-section" id="sheet-spice-section">
            <p class="sheet-section-title">Level Pedas</p>
            <div
              class="sheet-options-grid single"
              id="sheet-spice-options"
            ></div>
          </div>

          <div class="sheet-section" id="sheet-addon-section">
            <p class="sheet-section-title">Tambahan</p>
            <div class="sheet-options-grid" id="sheet-addon-options"></div>
          </div>

          <div class="sheet-section">
            <p class="sheet-section-title">Catatan</p>
            <textarea
              class="sheet-textarea"
              id="sheet-catatan"
              placeholder="Contoh: jangan pakai bawang, sambal dipisah..."
              rows="3"
            ></textarea>
          </div>
        </div>

        <div class="sheet-footer">
          <button class="btn-tambah" onclick="confirmAddToOrder()">
            Tambahkan Pesanan &nbsp;→
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── GLOBAL STATE ──────────────────────────────
      let currentVendorId = null;
      let allFoods = [];
      let allVendors = [];
      let sheetData = {};
      let sheetQty = 1;
      let selectedSpice = null;
      let selectedAddons = [];
      let recommendationRaw = null;

      // ✅ PLACEHOLDER ML
      const MOOD_PLACEHOLDER = localStorage.getItem("mood") || "neutral";
      const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";

      // ✅ LOAD CART & DINING TYPE
      let cart = getCart();
      const diningType = getDiningType();

      // ── FETCH FOODS & VENDORS ──────────────────────
      async function loadData() {
        try {
          const res = await apiFetch("/foods?per_page=500");
          allFoods = res.data;

          try {
            const mlUrl = `https://api-ml.aryo.fyi/recommend-external/${MOOD_PLACEHOLDER}/${USER_ID_PLACEHOLDER}`;
            const recRes = await fetch(mlUrl);
            const recJson = await recRes.json();
            if (recJson && recJson.vendors) recommendationRaw = recJson.vendors;
          } catch (err) { console.error("ML Error:", err); }

          const vendorMap = new Map();
          allFoods.forEach((food) => {
            if (food.vendor && !vendorMap.has(food.vendor.id)) {
              vendorMap.set(food.vendor.id, food.vendor);
            }
          });
          allVendors = Array.from(vendorMap.values());

          renderVendors(allVendors);
          if (allVendors.length > 0) {
            selectVendor(allVendors[0].id);
          }
          renderCart();
        } catch (err) { console.error("Load Data Fail:", err); }
      }

      function renderVendors(vendors) {
        const container = document.getElementById("vendor-container");
        container.innerHTML = vendors.map(v => `
          <div class="vendor-card" id="vendor-${v.id}" onclick="selectVendor(${v.id})">
            <div class="vendor-logo">🏪</div>
            <span class="vendor-name">${v.name}</span>
          </div>`).join("");
      }

      function selectVendor(vendorId) {
        currentVendorId = vendorId;
        document.querySelectorAll(".vendor-card").forEach(c => c.classList.remove("active"));
        const activeCard = document.getElementById(`vendor-${vendorId}`);
        if (activeCard) activeCard.classList.add("active");

        const vendor = allVendors.find(v => v.id === vendorId);
        if (vendor) document.getElementById("vendor-title").textContent = vendor.name;

        // Render Chip Filter Dinamis
        renderFilterTabs();

        // Default: filter 'all'
        const firstTab = document.querySelector(".filter-tag");
        if (firstTab) setFilter(firstTab, "all");
      }

      function renderFilterTabs() {
        const filterRow = document.getElementById("filter-row");
        const vendorFoods = allFoods.filter(f => f.vendor_id == currentVendorId);
        
        // Ambil kategori (type) unik dari database
        const categories = [...new Set(vendorFoods.map(f => f.type))].filter(Boolean);

        let html = `<button class="filter-tag active" onclick="setFilter(this, 'all')">Semua</button>`;
        
        if (localStorage.getItem("moodbites") !== "NO_MOODBITES") {
          html += `<button id="rekomendasi-btn" class="filter-tag" onclick="setFilter(this, 'paket')">Rekomendasi</button>`;
        }

        categories.forEach(cat => {
          html += `<button class="filter-tag" onclick="setFilter(this, '${cat}')">${cat}</button>`;
        });

        filterRow.innerHTML = html;
      }

      function cleanString(str) {
        return str ? str.toLowerCase().replace(/[^a-z0-9]/g, "") : "";
      }

      function setFilter(el, category) {
        document.querySelectorAll(".filter-tag").forEach(t => t.classList.remove("active"));
        el.classList.add("active");

        let filtered = [];
        if (category === "all") {
          filtered = allFoods.filter(f => f.vendor_id == currentVendorId);
        } else if (category === "paket") {
          if (recommendationRaw) {
            const vData = recommendationRaw.find(v => v.vendor_id == currentVendorId);
            if (vData) {
              const recNames = new Set();
              Object.keys(vData.condiment_categories).forEach(k => vData.condiment_categories[k].forEach(i => recNames.add(cleanString(i["Nama Menu"]))));
              vData.standalone_menus.forEach(i => recNames.add(cleanString(i["Nama Menu"])));
              filtered = allFoods.filter(f => f.vendor_id == currentVendorId && recNames.has(cleanString(f.name)));
            }
          }
        } else {
          // Filter Berdasarkan field 'type' di database (Lauk, Sayur, dkk)
          filtered = allFoods.filter(f => f.vendor_id == currentVendorId && f.type === category);
        }
        renderFoods(filtered);
      }

      function renderFoods(foods) {
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = foods.map(food => {
          const isSoldOut = !food.active;
          const imgUrl = getImageUrl(food.image);
          const emoji = getEmojiByType(food.type);
          return `
            <div class="menu-card ${isSoldOut ? "sold-out" : ""}" onclick="${isSoldOut ? '' : `openSheetWithData(${food.id})`}">
              <div class="menu-img-wrap">
                ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'">` : ""}
                <div class="menu-img-placeholder">${emoji}</div>
                ${isSoldOut ? '<div class="sold-out-badge">Habis</div>' : ""}
              </div>
              <div class="menu-info">
                <p class="menu-name">${food.name}</p>
                <p class="menu-price">${formatRp(food.price)}</p>
              </div>
            </div>`;
        }).join("");
      }

      function getEmojiByType(type) {
        const map = { FOOD: "🍽️", DRINK: "🧋", SNACK: "🍟", PRASMANAN: "🍱" };
        return map[type] || "🍴";
      }

      function openSheetWithData(foodId) {
        const food = allFoods.find(f => f.id === foodId);
        sheetData = {
          id: food.id, name: food.name, basePrice: parseInt(food.price),
          est: food.estimated_time, emoji: getEmojiByType(food.type),
          spice: food.spice || [],
          addons: (food.addons || []).map(a => ({ label: a.addon.name, price: a.pivot.extra_price }))
        };
        sheetQty = 1; selectedSpice = null; selectedAddons = [];
        document.getElementById("sheet-catatan").value = "";
        document.getElementById("sheet-name").textContent = sheetData.name;
        document.getElementById("sheet-qty").textContent = 1;
        document.getElementById("sheet-img").textContent = sheetData.emoji;
        document.getElementById("sheet-est-text").innerHTML = `*estimasi: <strong>${sheetData.est} menit</strong>`;
        const imgUrl = getImageUrl(food.image);
        if(imgUrl) document.getElementById("sheet-img").innerHTML = `<img src="${imgUrl}">`;
        
        const spiceCon = document.getElementById("sheet-spice-options");
        const spices = sheetData.spice.length ? sheetData.spice : ["Normal", "Pedas"];
        spiceCon.innerHTML = spices.map(s => `<div class="sheet-option" onclick="selectSpice(this,'${s}')"><div class="sheet-option-radio"><div class="sheet-option-radio-dot"></div></div><span>${s}</span></div>`).join("");
        
        const addonCon = document.getElementById("sheet-addon-options");
        document.getElementById("sheet-addon-section").style.display = sheetData.addons.length ? "block" : "none";
        addonCon.innerHTML = sheetData.addons.map((a, i) => `<div class="sheet-option" onclick="toggleAddon(this,${i})"><div class="sheet-option-checkbox"><span class="sheet-option-checkmark">✓</span></div><span>${a.label} (+${formatRp(a.price)})</span></div>`).join("");
        
        updateSheetPrice();
        document.getElementById("sheet-overlay").classList.add("open");
        document.getElementById("bottom-sheet").classList.add("open");
      }

      function closeSheet() {
        document.getElementById("sheet-overlay").classList.remove("open");
        document.getElementById("bottom-sheet").classList.remove("open");
      }

      function changeSheetQty(delta) {
        sheetQty = Math.max(1, sheetQty + delta);
        document.getElementById("sheet-qty").textContent = sheetQty;
        updateSheetPrice();
      }

      function selectSpice(el, val) {
        document.querySelectorAll("#sheet-spice-options .sheet-option").forEach(o => o.classList.remove("selected"));
        el.classList.add("selected");
        selectedSpice = val;
      }

      function toggleAddon(el, idx) {
        el.classList.toggle("selected");
        const a = sheetData.addons[idx];
        if (el.classList.contains("selected")) selectedAddons.push(a);
        else selectedAddons = selectedAddons.filter(x => x.label !== a.label);
        updateSheetPrice();
      }

      function updateSheetPrice() {
        const total = (sheetData.basePrice + selectedAddons.reduce((s,a) => s+a.price, 0)) * sheetQty;
        document.getElementById("sheet-price").textContent = formatRp(total);
      }

      function confirmAddToOrder() {
        cart.push({
          id: Date.now(), food_id: sheetData.id, name: sheetData.name,
          basePrice: sheetData.basePrice, addonAmt: selectedAddons.reduce((s,a) => s+a.price, 0),
          qty: sheetQty, est: parseInt(sheetData.est), emoji: sheetData.emoji,
          spice: selectedSpice, addons: selectedAddons.map(a => a.label),
          catatan: document.getElementById("sheet-catatan").value,
        });
        saveCart(cart); renderCart(); closeSheet();
      }

      function renderCart() {
        const container = document.getElementById("order-items");
        const emptyEl = document.getElementById("cart-empty");
        const badge = document.getElementById("order-count");
        container.querySelectorAll(".cart-item").forEach(el => el.remove());

        if (cart.length === 0) {
          emptyEl.style.display = "flex"; badge.style.display = "none";
          document.getElementById("order-total").textContent = "Rp. 0";
          document.getElementById("order-est").textContent = "";
          document.getElementById("btn-pesan").disabled = true;
          return;
        }

        emptyEl.style.display = "none";
        let total = 0, maxEst = 0, count = 0;

        cart.forEach(item => {
          total += (item.basePrice + item.addonAmt) * item.qty;
          maxEst = Math.max(maxEst, item.est);
          count += item.qty;
          // FIX ERROR: Tambahkan fallback [] untuk addons
          const noteText = [item.spice, ...(item.addons || []), item.catatan].filter(Boolean).join(" · ");
          const div = document.createElement("div");
          div.className = "cart-item";
          div.innerHTML = `<div class="cart-item-top"><div class="cart-item-img">${item.emoji}</div><div class="cart-item-info"><p class="cart-item-name">${item.name}</p><p class="cart-item-price">${formatRp(item.basePrice + item.addonAmt)}</p><p class="cart-item-notes">${noteText}</p></div><button class="cart-item-delete" onclick="removeItem(${item.id})">🗑</button></div><div class="cart-qty-row"><button class="cart-qty-btn" onclick="changeQty(${item.id},-1)">−</button><span class="cart-qty-val">${item.qty}</span><button class="cart-qty-btn" onclick="changeQty(${item.id},1)">+</button></div>`;
          container.appendChild(div);
        });

        document.getElementById("order-total").textContent = formatRp(total);
        document.getElementById("order-est").innerHTML = `*estimasi: <strong>${maxEst} mnt</strong>`;
        document.getElementById("btn-pesan").disabled = false;
        badge.textContent = count; badge.style.display = "flex";
      }

      function removeItem(id) { cart = cart.filter(i => i.id !== id); saveCart(cart); renderCart(); }
      function changeQty(id, d) { 
        const i = cart.find(x => x.id === id); 
        if(i) { i.qty = Math.max(1, i.qty + d); saveCart(cart); renderCart(); } 
      }

      function handlePesan() {
        if (!cart.length) return;
        sessionStorage.setItem("maxEst", Math.max(...cart.map(i => i.est)));
        window.location.href = "review-order.html";
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadData();
        document.getElementById("order-type-badge").textContent = getDiningType();
      });
    </script>
  </body>
</html>
