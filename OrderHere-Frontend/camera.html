<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capture Mood - Locked to FHD Camera</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .video-container { 
            width: 800px; 
            max-width: 90%; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: border-color 0.5s;
        }

        .video-container.connected {
            border-color: #f97316;
        }

        video { 
            width: 100%; 
            background: #111; 
            display: block;
        }

        .status-text { 
            font-size: 18px; 
            font-weight: bold; 
            color: #f97316; 
            margin: 25px 0;
            text-align: center;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        button { 
            padding: 20px 50px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s;
            display: none; /* Muncul hanya jika kamera yang benar aktif */
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        button:hover { 
            background: #fb923c; 
            transform: translateY(-3px); 
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container" id="vidContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="status" class="status-text">Menghubungkan ke FHD Camera...</div>
    <div id="error" class="error-msg"></div>
    
    <button id="captureBtn" onclick="capture()">Ambil Foto & Deteksi</button>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const errorEl = document.getElementById("error");
        const captureBtn = document.getElementById("captureBtn");
        const vidContainer = document.getElementById("vidContainer");
        
        // NAMA SPESIFIK KAMERA ANDA
        const TARGET_CAMERA_NAME = "FHD Camera (1bcf:28c4)";

        async function initSpecificCamera() {
            try {
                // 1. Minta izin akses (Wajib agar label terbaca)
                const streamInit = await navigator.mediaDevices.getUserMedia({ video: true });
                streamInit.getTracks().forEach(t => t.stop());

                // 2. Scan semua daftar kamera
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                // 3. Cari kamera yang mengandung nama TARGET
                const myExternalCam = videoDevices.find(d => d.label.includes("FHD Camera"));

                if (myExternalCam) {
                    startStream(myExternalCam.deviceId);
                } else {
                    statusEl.textContent = "SISTEM ERROR";
                    statusEl.style.color = "#ef4444";
                    errorEl.textContent = `Kamera "${TARGET_CAMERA_NAME}" tidak terdeteksi. Periksa kabel USB.`;
                    errorEl.style.display = "block";
                }

            } catch (err) {
                statusEl.textContent = "Akses Kamera Ditolak";
                errorEl.textContent = "Pastikan Anda memberikan izin akses kamera di browser.";
                errorEl.style.display = "block";
            }
        }

        function startStream(deviceId) {
            const constraints = {
                video: { 
                    deviceId: { exact: deviceId },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    video.srcObject = stream;
                    statusEl.textContent = "KAMERA EKSTERNAL AKTIF";
                    statusEl.style.color = "#22c55e"; // Warna Hijau
                    vidContainer.classList.add("connected");
                    captureBtn.style.display = "block";
                })
                .catch(err => {
                    statusEl.textContent = "Gagal Memuat Stream";
                    console.error(err);
                });
        }

        function capture() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Gambar frame
            ctx.drawImage(video, 0, 0);
            
            const base64 = canvas.toDataURL("image/png");
            statusEl.textContent = "Foto Berhasil Diambil!";
            
            // Integrasikan dengan fungsi sendToAndreML(base64) Anda di sini
            alert("Memproses Wajah...");
        }

        // Jalankan otomatis saat halaman dimuat
        window.onload = initSpecificCamera;

        // Jika kamera dicabut/pasang, sistem akan mengecek ulang
        navigator.mediaDevices.ondevicechange = () => {
            location.reload();
        };
    </script>
</body>
</html>
