<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <title>Capture Mood</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #ffffff; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            min-height: -webkit-fill-available;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .video-container { 
            width: 90%; 
            max-width: 600px; 
            aspect-ratio: 4 / 3; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 4px solid #f97316;
            box-shadow: 
                0 0 30px rgba(249, 115, 22, 0.5),
                0 0 80px rgba(249, 115, 22, 0.3),
                inset 0 0 30px rgba(249, 115, 22, 0.05);
            background: #f3f4f6;
            position: relative;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(249, 115, 22, 0.5),
                    0 0 80px rgba(249, 115, 22, 0.3),
                    inset 0 0 30px rgba(249, 115, 22, 0.05);
            }
            50% { 
                box-shadow: 
                    0 0 40px rgba(249, 115, 22, 0.7),
                    0 0 100px rgba(249, 115, 22, 0.4),
                    inset 0 0 40px rgba(249, 115, 22, 0.08);
            }
        }

        /* Tablet Portrait */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .video-container {
                max-width: 700px;
                aspect-ratio: 4 / 3;
            }
        }

        /* Tablet Landscape */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            .video-container {
                max-width: 800px;
                aspect-ratio: 16 / 10;
            }
        }

        /* Large Tablet / Small Desktop */
        @media (min-width: 1024px) {
            .video-container {
                max-width: 900px;
                aspect-ratio: 16 / 10;
            }
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
            background: #e5e7eb;
        }

        .capture-btn { 
            margin-top: 30px;
            padding: 18px 50px; 
            background: linear-gradient(135deg, #f97316, #ea580c); 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 6px 25px rgba(249, 115, 22, 0.5);
            transition: transform 0.1s, box-shadow 0.2s;
            -webkit-user-select: none;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .capture-btn:active { 
            transform: scale(0.95); 
            box-shadow: 0 3px 15px rgba(249, 115, 22, 0.4);
        }

        .capture-btn:disabled { 
            background: #d1d5db; 
            cursor: not-allowed; 
            opacity: 0.7;
            box-shadow: none;
        }

        /* Responsive button for tablets */
        @media (min-width: 768px) {
            .capture-btn {
                padding: 20px 60px;
                font-size: 20px;
            }
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video" autoplay playsinline muted webkit-playsinline></video>
    </div>

    <button class="capture-btn" id="captureBtn">Capture</button>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const captureBtn = document.getElementById("captureBtn");
        const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";
        const ANDRE_ML_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        const BACKEND_BASE_URL = "https://api-ml.aryo.fyi";
        const RECOMMEND_ENDPOINT_BASE = `${BACKEND_BASE_URL}/recommend-external`;
        const TARGET_CAMERA_KEYWORDS = ["1bcf", "28c4", "sunplus", "sonix", "fhd", "usb camera", "webcam", "pc camera"];
        const PREFERRED_DEVICE_ID = localStorage.getItem("preferred_camera_id") || null;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let currentStream = null;
        let lastDetectedMood = null;

        // Canvas target size (lebih kecil)
        const CANVAS_MAX_WIDTH = 640;
        const CANVAS_MAX_HEIGHT = 480;

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                return devices.filter(d => d.kind === "videoinput");
            } catch { return []; }
        }

        function findTargetCamera(cameras) {
            if (PREFERRED_DEVICE_ID) {
                const saved = cameras.find(c => c.deviceId === PREFERRED_DEVICE_ID);
                if (saved) return saved;
            }
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) return cam;
                }
            }
            if (isMobile) {
                const front = cameras.find(c => {
                    const label = (c.label || "").toLowerCase();
                    return label.includes("front") || label.includes("depan");
                });
                if (front) return front;
            }
            return cameras[0] || null;
        }

        async function requestCamera(targetDeviceId = null) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            if (!targetDeviceId) {
                try {
                    const tempConstraints = isMobile 
                        ? { video: { facingMode: "user" }, audio: false }
                        : { video: true, audio: false };
                    
                    const tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
                    tempStream.getTracks().forEach(t => t.stop());
                    
                    const cameras = await enumerateCameras();
                    const target = findTargetCamera(cameras);
                    if (target) {
                        targetDeviceId = target.deviceId;
                        localStorage.setItem("preferred_camera_id", targetDeviceId);
                    }
                } catch { return; }
            }

            const constraintsList = [
                { video: { deviceId: { exact: targetDeviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false },
                { video: { deviceId: { exact: targetDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { deviceId: { exact: targetDeviceId } }, audio: false },
                { video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            for (const constraints of constraintsList) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    break;
                } catch { continue; }
            }

            if (!stream) return;

            currentStream = stream;
            videoElement.srcObject = stream;

            videoElement.addEventListener("loadedmetadata", () => {
                videoElement.play().catch(() => {});
            }, { once: true });

            setTimeout(() => {
                if (videoElement.paused) videoElement.play().catch(() => {});
            }, 500);
        }

        captureBtn.addEventListener("click", capture);

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" && !captureBtn.disabled) {
                e.preventDefault();
                capture();
            }
        });

        function capture() {
            if (!currentStream) return;

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            // Hitung ukuran canvas yang lebih kecil dengan aspect ratio yang sama
            const videoWidth = videoElement.videoWidth || 1920;
            const videoHeight = videoElement.videoHeight || 1080;
            
            let targetWidth = videoWidth;
            let targetHeight = videoHeight;
            
            // Scale down jika terlalu besar
            if (targetWidth > CANVAS_MAX_WIDTH || targetHeight > CANVAS_MAX_HEIGHT) {
                const ratio = Math.min(CANVAS_MAX_WIDTH / targetWidth, CANVAS_MAX_HEIGHT / targetHeight);
                targetWidth = Math.floor(targetWidth * ratio);
                targetHeight = Math.floor(targetHeight * ratio);
            }
            
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            captureBtn.disabled = true;

            canvas.toBlob((blob) => {
                if (!blob) { captureBtn.disabled = false; return; }
                sendToAndreML(blob);
            }, "image/jpeg", 0.85);
        }

        async function sendToAndreML(jpegBlob) {
            const formData = new FormData();
            formData.append("image", jpegBlob, `mood_${USER_ID_PLACEHOLDER}.jpg`);
            formData.append("user_id", USER_ID_PLACEHOLDER);

            try {
                const response = await fetch(ANDRE_ML_ENDPOINT, { method: "POST", body: formData });
                if (!response.ok) { captureBtn.disabled = false; return; }
                
                const data = await response.json();
                const mood = extractMood(data);
                lastDetectedMood = mood;
                await sendRecommendation(mood, USER_ID_PLACEHOLDER);
            } catch {
                captureBtn.disabled = false;
            }
        }

        async function sendRecommendation(mood, user_id) {
            const safeMood = encodeURIComponent(mood.trim().toLowerCase());
            const safeUserId = encodeURIComponent(user_id);
            const targetUrl = `${RECOMMEND_ENDPOINT_BASE}/${safeMood}/${safeUserId}`;

            try {
                const res = await fetch(targetUrl, {
                    method: "POST", 
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id, mood })
                });
                
                if (res.ok) {
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                    return;
                }
            } catch {}

            try {
                const res = await fetch(targetUrl, { method: "GET" });
                if (res.ok) {
                    setTimeout(() => { window.location.href = "index.html"; }, 1500);
                    return;
                }
            } catch {}

            captureBtn.disabled = false;
        }

        function extractMood(data) {
            if (!data) return "neutral";
            const fields = ["mood", "emotion", "result", "label", "prediction", "class", "sentiment", "expression"];
            for (const field of fields) {
                if (data[field]) return String(data[field]);
                if (data.data && data.data[field]) return String(data.data[field]);
                if (data.result && data.result[field]) return String(data.result[field]);
            }
            return "neutral";
        }

        window.addEventListener("load", () => requestCamera());
        window.addEventListener("beforeunload", () => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
