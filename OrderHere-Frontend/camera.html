<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Capture Mood - Direct Access</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            min-height: -webkit-fill-available;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            background: #111;
            position: relative;
        }

        /* Desktop: aspect ratio lebih lebar */
        @media (min-width: 768px) {
            .video-container {
                max-width: 640px;
                aspect-ratio: 16 / 10;
            }
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
            background: #000;
        }

        .status { 
            margin-top: 15px;
            font-size: 14px; 
            color: #f97316; 
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }

        .camera-info {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            padding: 0 20px;
            max-width: 500px;
        }

        .mood-result {
            margin-top: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1e40af, #7c3aed);
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            display: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-select-container {
            margin-top: 10px;
            width: 90%;
            max-width: 500px;
            display: none;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: #1f2937;
            color: #fff;
            border: 2px solid #374151;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        select:focus { border-color: #f97316; }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button { 
            padding: 14px 28px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            transition: transform 0.1s;
            -webkit-user-select: none;
            user-select: none;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

        .btn-secondary {
            background: #374151;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        canvas { display: none; }

        .https-warning {
            background: #7f1d1d;
            color: #fecaca;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 13px;
            text-align: center;
            display: none;
            max-width: 500px;
        }

        .target-badge {
            display: inline-block;
            background: #1e40af;
            color: #dbeafe;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preview-container {
            margin-top: 15px;
            width: 90%;
            max-width: 500px;
            display: none;
            text-align: center;
        }

        .preview-container img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #374151;
        }

        .preview-info {
            font-size: 11px;
            color: #6b7280;
            margin-top: 6px;
        }

        /* Desktop: keyboard shortcut hint */
        .shortcut-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
            display: none;
        }

        @media (min-width: 768px) {
            .shortcut-hint {
                display: block;
            }
        }

        .shortcut-hint kbd {
            background: #374151;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #4b5563;
        }
    </style>
</head>
<body>

    <div class="https-warning" id="httpsWarning">
        ⚠️ Kamera WAJIB pakai HTTPS. Buka via <b>https://</b> atau <b>localhost</b>.
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted webkit-playsinline></video>
    </div>

    <div class="status" id="status">Meminta Izin Kamera...</div>
    <div class="camera-info" id="cameraInfo"></div>
    <div class="mood-result" id="moodResult"></div>
    <div class="target-badge">🎯 Target: FHD Camera</div>

    <div class="preview-container" id="previewContainer">
        <img id="previewImg" alt="Preview foto" />
        <div class="preview-info" id="previewInfo"></div>
    </div>

    <div class="camera-select-container" id="cameraSelectContainer">
        <select id="cameraSelect"></select>
    </div>

    <div class="button-row">
        <button id="captureBtn">📸 FOTO & DETEKSI</button>
        <button id="switchBtn" class="btn-secondary">🔄 Ganti Kamera</button>
    </div>

    <div class="shortcut-hint">
        💡 Tekan <kbd>SPACE</kbd> untuk foto cepat
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const cameraInfoEl = document.getElementById("cameraInfo");
        const moodResultEl = document.getElementById("moodResult");
        const captureBtn = document.getElementById("captureBtn");
        const switchBtn = document.getElementById("switchBtn");
        const httpsWarning = document.getElementById("httpsWarning");
        const cameraSelect = document.getElementById("cameraSelect");
        const cameraSelectContainer = document.getElementById("cameraSelectContainer");
        const previewContainer = document.getElementById("previewContainer");
        const previewImg = document.getElementById("previewImg");
        const previewInfo = document.getElementById("previewInfo");
        
        // ==========================================
        // 🔧 KONFIGURASI USER & API
        // ==========================================
        const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";
        
        // ✅ ANDRE ML - untuk deteksi mood (HTTPS)
        const ANDRE_ML_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        
        // ✅ BACKEND - untuk simpan rekomendasi (HTTP)
        const BACKEND_BASE_URL = "http://103.185.52.14:8067";
        const RECOMMEND_ENDPOINT_BASE = `${BACKEND_BASE_URL}/recommend-external`;

        const TARGET_CAMERA_KEYWORDS = ["1bcf", "28c4", "sunplus", "sonix", "fhd", "usb camera", "webcam", "pc camera"];
        const TARGET_RESOLUTION = { width: 1920, height: 1080 };
        const PREFERRED_DEVICE_ID = localStorage.getItem("preferred_camera_id") || null;

        let currentStream = null;
        let allCameras = [];

        // ==========================================
        // 🔍 DETEKSI DEVICE TYPE
        // ==========================================
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        console.log(`📱 Device: ${isMobile ? 'Mobile' : 'Desktop/Laptop'}`);

        // ==========================================
        // 1. CEK HTTPS & INIT
        // ==========================================
        if (!window.isSecureContext) {
            httpsWarning.style.display = "block";
            statusEl.textContent = "⚠️ Butuh HTTPS! Kamera tidak akan jalan.";
            statusEl.style.color = "#ef4444";
        }

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                allCameras = devices.filter(d => d.kind === "videoinput");
                console.log(`📹 Total kamera terdeteksi: ${allCameras.length}`);
                return allCameras;
            } catch (err) {
                console.error("Gagal enumerate:", err);
                return [];
            }
        }

        function findTargetCamera(cameras) {
            // Prioritas 1: Device yang pernah dipilih
            if (PREFERRED_DEVICE_ID) {
                const saved = cameras.find(c => c.deviceId === PREFERRED_DEVICE_ID);
                if (saved) {
                    console.log("✅ Pakai kamera tersimpan:", saved.label);
                    return saved;
                }
            }

            // Prioritas 2: Cocokkan dengan keyword target (USB webcam FHD)
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) {
                        console.log("🎯 Kamera target terdeteksi:", cam.label);
                        return cam;
                    }
                }
            }

            // Prioritas 3: Kamera depan (mobile) atau webcam built-in (laptop)
            if (isMobile) {
                const front = cameras.find(c => {
                    const label = (c.label || "").toLowerCase();
                    return label.includes("front") || label.includes("depan");
                });
                if (front) return front;
            } else {
                // Laptop: cari webcam built-in (biasanya ada kata "integrated" atau "built-in")
                const builtin = cameras.find(c => {
                    const label = (c.label || "").toLowerCase();
                    return label.includes("integrated") || label.includes("built-in") || label.includes("facetime");
                });
                if (builtin) return builtin;
            }

            // Fallback: kamera pertama
            return cameras[0] || null;
        }

        async function requestCamera(targetDeviceId = null) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.textContent = "Browser tidak mendukung kamera.";
                statusEl.style.color = "#ef4444";
                return;
            }

            statusEl.textContent = "🔍 Mencari kamera...";
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            // Jika belum ada target, enumerate dulu
            if (!targetDeviceId) {
                try {
                    // Request awal untuk dapat label kamera
                    const tempConstraints = isMobile 
                        ? { video: { facingMode: "user" }, audio: false }
                        : { video: true, audio: false }; // Laptop: tidak pakai facingMode
                    
                    const tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
                    tempStream.getTracks().forEach(t => t.stop());
                    
                    const cameras = await enumerateCameras();
                    const target = findTargetCamera(cameras);
                    
                    if (target) {
                        targetDeviceId = target.deviceId;
                        localStorage.setItem("preferred_camera_id", targetDeviceId);
                        populateCameraSelect(cameras, targetDeviceId);
                    }
                } catch (err) {
                    console.error("Gagal request awal:", err);
                    handleCameraError(err);
                    return;
                }
            }

            // Bangun constraints dengan fallback bertingkat
            const constraintsList = [
                // Percobaan 1: Device spesifik + FHD
                { 
                    video: { 
                        deviceId: { exact: targetDeviceId }, 
                        width: { ideal: TARGET_RESOLUTION.width }, 
                        height: { ideal: TARGET_RESOLUTION.height },
                        frameRate: { ideal: 30 }
                    }, 
                    audio: false 
                },
                // Percobaan 2: Device spesifik + 720p
                { 
                    video: { 
                        deviceId: { exact: targetDeviceId }, 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    }, 
                    audio: false 
                },
                // Percobaan 3: Device spesifik saja
                { 
                    video: { deviceId: { exact: targetDeviceId } }, 
                    audio: false 
                },
                // Percobaan 4: FHD tanpa device spesifik
                { 
                    video: { 
                        width: { ideal: TARGET_RESOLUTION.width }, 
                        height: { ideal: TARGET_RESOLUTION.height } 
                    }, 
                    audio: false 
                },
                // Percobaan 5: Fallback total
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsList) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    console.log("✅ Kamera berhasil diakses dengan constraints:", constraints);
                    break;
                } catch (err) {
                    lastError = err;
                    console.warn("⚠️ Constraint gagal:", err.name, constraints);
                    continue;
                }
            }

            if (!stream) {
                handleCameraError(lastError);
                return;
            }

            currentStream = stream;
            videoElement.srcObject = stream;
            
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            
            cameraInfoEl.innerHTML = `
                📷 <b>${track.label || "Unknown Camera"}</b><br>
                Resolusi: ${settings.width}×${settings.height} @ ${settings.frameRate?.toFixed(1) || "?"}fps
            `;
            
            statusEl.textContent = "✅ Kamera AKTIF";
            statusEl.style.color = "#22c55e";

            // Play video
            videoElement.addEventListener("loadedmetadata", () => {
                videoElement.play()
                    .then(() => {
                        captureBtn.style.display = "inline-block";
                        switchBtn.style.display = "inline-block";
                    })
                    .catch(err => {
                        console.error("Play gagal:", err);
                        statusEl.textContent = "👆 Tap/klik untuk aktifkan";
                    });
            }, { once: true });

            // Fallback play
            setTimeout(() => {
                if (videoElement.paused) {
                    videoElement.play().catch(() => {});
                }
            }, 500);
        }

        function handleCameraError(err) {
            let errorMsg = "❌ ";
            
            if (err?.name === "NotFoundError") {
                errorMsg += "Kamera tidak ditemukan. Colokkan USB webcam atau cek koneksi.";
            } else if (err?.name === "NotAllowedError") {
                errorMsg += "Izin ditolak. Buka Settings browser → Camera → Allow.";
            } else if (err?.name === "NotReadableError") {
                errorMsg += "Kamera sedang dipakai app lain. Tutup Zoom/Meet/Skype.";
            } else if (err?.name === "OverconstrainedError") {
                errorMsg += "Kamera tidak support resolusi yang diminta.";
            } else {
                errorMsg += `Error: ${err?.message || "Unknown"}`;
            }
            
            statusEl.textContent = errorMsg;
            statusEl.style.color = "#ef4444";
        }

        function populateCameraSelect(cameras, selectedId) {
            if (cameras.length <= 1) return;
            
            cameraSelect.innerHTML = "";
            cameras.forEach(cam => {
                const opt = document.createElement("option");
                opt.value = cam.deviceId;
                const isTarget = TARGET_CAMERA_KEYWORDS.some(kw => 
                    (cam.label || "").toLowerCase().includes(kw.toLowerCase())
                );
                opt.textContent = (isTarget ? "🎯 " : "") + (cam.label || "Camera");
                if (cam.deviceId === selectedId) opt.selected = true;
                cameraSelect.appendChild(opt);
            });
            cameraSelectContainer.style.display = "block";
        }

        cameraSelect.addEventListener("change", async (e) => {
            localStorage.setItem("preferred_camera_id", e.target.value);
            statusEl.textContent = "🔄 Mengganti kamera...";
            await requestCamera(e.target.value);
        });

        switchBtn.addEventListener("click", () => {
            cameraSelectContainer.style.display = 
                cameraSelectContainer.style.display === "none" ? "block" : "none";
        });

        // ==========================================
        // 🖱️ INTERACTION HANDLERS
        // ==========================================
        // Tap-to-start fix for iOS
        let userInteracted = false;
        function handleFirstInteraction() {
            if (userInteracted) return;
            userInteracted = true;
            if (videoElement.paused && currentStream) {
                videoElement.play().catch(() => {});
            }
            document.removeEventListener("touchstart", handleFirstInteraction);
            document.removeEventListener("click", handleFirstInteraction);
        }
        document.addEventListener("touchstart", handleFirstInteraction, { passive: true });
        document.addEventListener("click", handleFirstInteraction);

        // Keyboard shortcut untuk laptop (SPACE untuk capture)
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" && !captureBtn.disabled && captureBtn.style.display !== "none") {
                e.preventDefault();
                capture();
            }
        });

        // ==========================================
        // 2. CAPTURE & KIRIM KE ANDRE ML
        // ==========================================
        captureBtn.addEventListener("click", capture);

        function capture() {
            if (!currentStream) {
                statusEl.textContent = "Kamera belum aktif.";
                return;
            }

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = videoElement.videoWidth || 1920;
            canvas.height = videoElement.videoHeight || 1080;
            
            // Mirror flip
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            statusEl.innerHTML = '<span class="loading"></span>Membuat file JPEG...';
            captureBtn.disabled = true;
            moodResultEl.style.display = "none";

            canvas.toBlob((blob) => {
                if (!blob) {
                    statusEl.textContent = "❌ Gagal membuat file JPEG.";
                    captureBtn.disabled = false;
                    return;
                }

                previewImg.src = URL.createObjectURL(blob);
                previewInfo.textContent = `📦 ${(blob.size / 1024).toFixed(1)} KB • ${canvas.width}×${canvas.height}px`;
                previewContainer.style.display = "block";

                sendToAndreML(blob);
            }, "image/jpeg", 0.85);
        }

        // ==========================================
        // 3. KIRIM KE ANDRE ML (DETEKSI MOOD)
        // ==========================================
        async function sendToAndreML(jpegBlob) {
            statusEl.innerHTML = '<span class="loading"></span>Menganalisis mood di Andre ML...';
            const formData = new FormData();
            formData.append("image", jpegBlob, `mood_${USER_ID_PLACEHOLDER}.jpg`);
            formData.append("user_id", USER_ID_PLACEHOLDER);

            try {
                console.log(`📤 Mengirim ke Andre ML: ${ANDRE_ML_ENDPOINT}`);
                const response = await fetch(ANDRE_ML_ENDPOINT, { 
                    method: "POST", 
                    body: formData 
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                console.log("📊 Response Andre ML:", data);

                const mood = extractMood(data);
                moodResultEl.textContent = `😊 Mood: ${mood}`;
                moodResultEl.style.display = "block";
                
                // ==========================================
                // 4. KIRIM KE BACKEND (SIMPAN REKOMENDASI)
                // ==========================================
                await sendRecommendation(mood, USER_ID_PLACEHOLDER);

            } catch (err) {
                console.error("❌ Error Andre ML:", err);
                statusEl.textContent = "❌ Gagal deteksi mood. Coba lagi.";
                statusEl.style.color = "#ef4444";
                captureBtn.disabled = false;
            }
        }

        // ==========================================
        // 5. KIRIM KE BACKEND & REDIRECT
        // ==========================================
        async function sendRecommendation(mood, user_id) {
            try {
                const safeMood = encodeURIComponent(mood.trim().toLowerCase());
                const safeUserId = encodeURIComponent(user_id);
                const targetUrl = `${RECOMMEND_ENDPOINT_BASE}/${safeMood}/${safeUserId}`;

                console.log(`🚀 Mengirim rekomendasi ke: ${targetUrl}`);
                statusEl.innerHTML = '<span class="loading"></span>Menyimpan rekomendasi...';

                // Coba POST dulu
                let res = await fetch(targetUrl, {
                    method: "POST", 
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: user_id, mood: mood })
                });

                // Fallback ke GET jika POST gagal
                if (!res.ok) {
                    console.warn("⚠️ POST gagal, coba GET...");
                    res = await fetch(targetUrl, { method: "GET" });
                }

                if (!res.ok) throw new Error(`Gagal menyimpan: HTTP ${res.status}`);

                console.log("✅ Rekomendasi berhasil disimpan!");
                statusEl.textContent = "✅ Berhasil! Mengalihkan ke halaman order...";
                statusEl.style.color = "#22c55e";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (err) {
                console.error("❌ Gagal mengirim rekomendasi:", err);
                statusEl.textContent = "⚠️ Gagal simpan, tapi tetap mengalihkan...";
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);
            }
        }

        function extractMood(data) {
            if (!data) return "neutral";
            const fields = ["mood", "emotion", "result", "label", "prediction", "class", "sentiment", "expression"];
            
            for (const field of fields) {
                if (data[field]) return String(data[field]);
                if (data.data && data.data[field]) return String(data.data[field]);
                if (data.result && data.result[field]) return String(data.result[field]);
            }
            return "neutral";
        }

        // ==========================================
        // 6. START
        // ==========================================
        window.addEventListener("load", () => requestCamera());
        window.addEventListener("beforeunload", () => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
