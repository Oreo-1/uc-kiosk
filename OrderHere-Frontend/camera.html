<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capture Mood - Generic Camera</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* MODAL PAKSA IZIN */
        #permissionModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
            display: none; 
        }

        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #f97316;
            max-width: 400px;
        }

        .video-container { 
            width: 800px; 
            max-width: 90%; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: border-color 0.5s;
        }

        .video-container.connected { border-color: #f97316; }

        video { width: 100%; background: #111; display: block; }

        .status-text { font-size: 18px; font-weight: bold; color: #f97316; margin: 25px 0; text-align: center; }

        .btn-orange { 
            padding: 15px 30px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        #captureBtn { display: none; padding: 20px 50px; font-size: 18px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- MODAL UNTUK MEMAKSA IZIN -->
    <div id="permissionModal">
        <div class="modal-content">
            <h2 style="color: #f97316;">Izin Kamera Diperlukan</h2>
            <p>Aplikasi ini membutuhkan akses kamera untuk mendeteksi wajah.</p>
            <p style="font-size: 13px; color: #aaa;">Klik tombol di bawah dan pilih "Allow/Izinkan" pada pop-up browser.</p>
            <br>
            <button class="btn-orange" onclick="retryPermission()">AKTIFKAN KAMERA</button>
        </div>
    </div>

    <div class="video-container" id="vidContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="status" class="status-text">Memulai Kamera...</div>
    
    <button id="captureBtn" class="btn-orange" onclick="capture()">Ambil Foto & Deteksi</button>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const captureBtn = document.getElementById("captureBtn");
        const vidContainer = document.getElementById("vidContainer");
        const permissionModal = document.getElementById("permissionModal");

        function retryPermission() {
            location.reload(); 
        }

        async function initAnyCamera() {
            try {
                statusEl.textContent = "Meminta akses kamera...";
                
                // Minta izin kamera (browser akan otomatis pilih kamera default)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                // Jika berhasil, sembunyikan modal dan jalankan stream
                permissionModal.style.display = "none";
                video.srcObject = stream;
                
                statusEl.textContent = "KAMERA AKTIF";
                statusEl.style.color = "#22c55e";
                vidContainer.classList.add("connected");
                captureBtn.style.display = "block";

            } catch (err) {
                console.error("Permission Error:", err);
                // JIKA IZIN DITOLAK atau kamera tidak ada
                showPermissionModal();
            }
        }

        function showPermissionModal() {
            permissionModal.style.display = "flex";
            statusEl.textContent = "AKSES DITOLAK / TIDAK ADA KAMERA";
            statusEl.style.color = "#ef4444";
        }

        function capture() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const base64 = canvas.toDataURL("image/png");
            alert("Foto Berhasil Diambil!");
            // Lanjut ke logic pengiriman base64 Anda
        }

        // Jalankan sistem saat halaman dimuat
        window.onload = initAnyCamera;

        // Deteksi jika perangkat dicabut/pasang
        navigator.mediaDevices.ondevicechange = () => {
            console.log("Hardware change detected");
        };
    </script>
</body>
</html>
