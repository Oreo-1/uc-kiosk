<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <title>Capture Mood</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #ffffff; 
            display: flex; 
            /* Default for mobile: stack vertically */
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            min-height: -webkit-fill-available;
            padding: 20px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden;
        }

        /* Desktop and Tablet: Side-by-Side layout */
        @media (min-width: 768px) {
            body {
                flex-direction: row;
                gap: 50px; /* Fixed distance between video and button */
            }
        }

        .video-container { 
            width: 100%; 
            max-width: 600px; 
            aspect-ratio: 4 / 3; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 4px solid #f97316;
            box-shadow: 
                0 0 30px rgba(249, 115, 22, 0.4),
                0 0 80px rgba(249, 115, 22, 0.2);
            background: #f3f4f6;
            position: relative;
            animation: glowPulse 3s ease-in-out infinite;
            /* Ensure it fits on short tablet screens */
            max-height: 70vh;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.005); box-shadow: 0 0 45px rgba(249, 115, 22, 0.6); }
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
        }

        .capture-btn { 
            /* Spacing for mobile (when stacked) */
            margin-top: 30px;
            
            padding: 20px 50px; 
            background: linear-gradient(135deg, #f97316, #ea580c); 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Adjust button for side-by-side mode */
        @media (min-width: 768px) {
            .capture-btn {
                margin-top: 0; /* Remove top margin when on the side */
                padding: 25px 60px;
                font-size: 22px;
            }
        }

        .capture-btn:active { 
            transform: scale(0.92); 
            box-shadow: 0 5px 15px rgba(249, 115, 22, 0.4);
        }

        .capture-btn:disabled { 
            background: #d1d5db; 
            cursor: not-allowed; 
            opacity: 0.7;
            box-shadow: none;
            transform: none;
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video" autoplay playsinline muted webkit-playsinline></video>
    </div>

    <button class="capture-btn" id="captureBtn">Capture Mood</button>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const captureBtn = document.getElementById("captureBtn");
        const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";
        const ANDRE_ML_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        const BACKEND_BASE_URL = "https://api-ml.aryo.fyi";
        const RECOMMEND_ENDPOINT_BASE = `${BACKEND_BASE_URL}/recommend-external`;
        const TARGET_CAMERA_KEYWORDS = ["1bcf", "28c4", "sunplus", "sonix", "fhd", "usb camera", "webcam", "pc camera"];
        const PREFERRED_DEVICE_ID = localStorage.getItem("preferred_camera_id") || null;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let currentStream = null;

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                return devices.filter(d => d.kind === "videoinput");
            } catch { return []; }
        }

        function findTargetCamera(cameras) {
            if (PREFERRED_DEVICE_ID) {
                const saved = cameras.find(c => c.deviceId === PREFERRED_DEVICE_ID);
                if (saved) return saved;
            }
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) return cam;
                }
            }
            if (isMobile) {
                const front = cameras.find(c => (c.label || "").toLowerCase().includes("front"));
                if (front) return front;
            }
            return cameras[0] || null;
        }

        async function requestCamera(targetDeviceId = null) {
            if (!navigator.mediaDevices?.getUserMedia) return;
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());

            if (!targetDeviceId) {
                try {
                    const temp = await navigator.mediaDevices.getUserMedia({ video: true });
                    temp.getTracks().forEach(t => t.stop());
                    const cameras = await enumerateCameras();
                    const target = findTargetCamera(cameras);
                    if (target) targetDeviceId = target.deviceId;
                } catch (e) { console.error(e); }
            }

            const constraints = { 
                video: targetDeviceId ? { deviceId: { exact: targetDeviceId } } : { facingMode: "user" },
                audio: false 
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                videoElement.play();
            } catch (e) { console.error(e); }
        }

        function capture() {
            if (!currentStream) return;
            captureBtn.disabled = true;
            captureBtn.innerText = "Processing...";

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            canvas.width = videoElement.videoWidth / 2; // Reduced size for speed
            canvas.height = videoElement.videoHeight / 2;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (blob) sendToAndreML(blob);
                else captureBtn.disabled = false;
            }, "image/jpeg", 0.8);
        }

        async function sendToAndreML(jpegBlob) {
            const formData = new FormData();
            formData.append("image", jpegBlob, "mood.jpg");
            formData.append("user_id", USER_ID_PLACEHOLDER);

            try {
                const response = await fetch(ANDRE_ML_ENDPOINT, { method: "POST", body: formData });
                const data = await response.json();
                const mood = data.mood || data.result || "neutral";
                await sendRecommendation(mood, USER_ID_PLACEHOLDER);
            } catch {
                captureBtn.disabled = false;
                captureBtn.innerText = "Capture Mood";
            }
        }

        async function sendRecommendation(mood, user_id) {
            const url = `${RECOMMEND_ENDPOINT_BASE}/${encodeURIComponent(mood.toLowerCase())}/${encodeURIComponent(user_id)}`;
            try {
                await fetch(url, { method: "POST" });
                window.location.href = "index.html";
            } catch {
                captureBtn.disabled = false;
                captureBtn.innerText = "Capture Mood";
            }
        }

        captureBtn.addEventListener("click", capture);
        window.addEventListener("load", () => requestCamera());
    </script>
</body>
</html>
