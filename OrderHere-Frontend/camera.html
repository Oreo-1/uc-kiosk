<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Capture Mood - Direct Access</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            transition: border-color 0.5s;
            position: relative;
            background: #111;
        }

        .video-container.connected { border-color: #f97316; }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); 
        }

        .status-text { 
            font-size: 16px; 
            font-weight: bold; 
            color: #f97316; 
            margin: 20px 0; 
            text-align: center;
            padding: 0 20px;
        }

        .btn-orange { 
            padding: 16px 32px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-switch {
            margin-top: 10px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        #captureBtn { display: none; margin-top: 10px; width: 80%; max-width: 300px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container" id="vidContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status-text">Meminta Akses Kamera...</div>
    
    <button id="captureBtn" class="btn-orange" onclick="capture()">AMBIL FOTO & DETEKSI</button>
    
    <button class="btn-switch" onclick="switchCamera()">Ganti Kamera</button>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const captureBtn = document.getElementById("captureBtn");
        const vidContainer = document.getElementById("vidContainer");
        const user_id = localStorage.getItem("user_id") || "guest";

        let currentFacingMode = "user"; 

        async function initCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = { 
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false 
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
                
                statusEl.textContent = "KAMERA AKTIF";
                statusEl.style.color = "#22c55e";
                vidContainer.classList.add("connected");
                captureBtn.style.display = "block";

            } catch (err) {
                console.error("Camera Error:", err);
                statusEl.textContent = "AKSES DITOLAK: Aktifkan izin kamera di pengaturan browser.";
                statusEl.style.color = "#ef4444";
            }
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            initCamera();
        }

        function capture() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageBase64 = canvas.toDataURL("image/png");
            
            statusEl.textContent = "Mendeteksi Mood...";
            statusEl.style.color = "#f97316";

            // Efek visual flash
            vidContainer.style.opacity = "0.5";
            setTimeout(() => vidContainer.style.opacity = "1", 100);

            sendToAndreML(imageBase64);
        }

        async function sendToAndreML(image) {
            try {
                // GANTI URL INI DENGAN URL API ML ANDA
                const res = await fetch("https://api.anda.com/detect-mood", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: image }),
                });

                const data = await res.json();
                const mood = data.mood || "neutral";

                statusEl.textContent = "Mood: " + mood;
                sendToBackend(user_id, mood);
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Gagal kirim ke AI.";
            }
        }

        async function sendToBackend(user_id, mood) {
            try {
                // GANTI URL INI DENGAN URL BACKEND ANDA
                await fetch("https://api.anda.com/v1/user-mood", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id, mood }),
                });

                statusEl.textContent = "Sukses! Mengarahkan...";
                setTimeout(() => window.location.href = "index.html", 1200);
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = initCamera;
    </script>
</body>
</html>
