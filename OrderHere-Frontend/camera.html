<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Capture Mood - Direct Access</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            background: #111;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); /* Mirror effect */
        }

        .status { 
            margin-top: 20px;
            font-size: 16px; 
            color: #f97316; 
            font-weight: bold;
            text-align: center;
        }

        button { 
            margin-top: 20px;
            padding: 16px 40px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; /* Sembunyi sampai kamera aktif */
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Atribut playsinline wajib untuk HP/iPhone agar tidak fullscreen otomatis -->
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="status" id="status">Meminta Izin Kamera...</div>
    
    <button id="captureBtn" onclick="capture()">FOTO & DETEKSI</button>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const captureBtn = document.getElementById("captureBtn");
        const user_id = localStorage.getItem("user_id") || "guest";

        // ==========================================
        // 1. FUNGSI REQUEST CAMERA (SESUAI SNIPPET ANDA)
        // ==========================================
        async function requestCamera() {
            try {
                // Request camera access
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: {
                        facingMode: "user", // Prioritaskan kamera depan HP/Tablet
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                });
                
                // Assign the video stream to the video element
                videoElement.srcObject = stream;
                
                // UI Update jika sukses
                statusEl.textContent = "KAMERA AKTIF";
                statusEl.style.color = "#22c55e";
                captureBtn.style.display = "block";
                
            } catch (err) {
                // Handle errors (misal: user menolak izin)
                console.error("Camera access denied or error occurred: ", err);
                statusEl.textContent = "AKSES DITOLAK: Aktifkan izin kamera di bar alamat browser.";
                statusEl.style.color = "#ef4444";
            }
        }

        // Jalankan fungsi saat halaman dimuat
        window.onload = requestCamera;

        // ==========================================
        // 2. FUNGSI CAPTURE & SEND
        // ==========================================
        function capture() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            
            // Balik gambar di canvas agar tidak mirror (teks terbaca normal)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            const imageBase64 = canvas.toDataURL("image/png");

            statusEl.textContent = "Mendeteksi Mood...";
            sendToAndreML(imageBase64);
        }

        async function sendToAndreML(image) {
            try {
                // Simulasi Fetch ke API ML Anda
                const res = await fetch("https://api-anda.com/detect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: image }),
                });

                const data = await res.json();
                const mood = data.mood || "neutral";

                statusEl.textContent = "Mood Terdeteksi: " + mood;
                sendToBackend(user_id, mood);
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Gagal menghubungi AI.";
            }
        }

        async function sendToBackend(user_id, mood) {
            try {
                // Simpan hasil ke Backend
                await fetch("https://api-anda.com/v1/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id, mood }),
                });

                statusEl.textContent = "Berhasil! Mengarahkan...";
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
