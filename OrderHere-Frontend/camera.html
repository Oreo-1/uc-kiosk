<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Capture Mood - FHD Camera (1bcf:28c4)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            min-height: -webkit-fill-available;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            background: #111;
            position: relative;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
            background: #000;
        }

        .status { 
            margin-top: 15px;
            font-size: 14px; 
            color: #f97316; 
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }

        .camera-info {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            padding: 0 20px;
            max-width: 500px;
        }

        .mood-result {
            margin-top: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1e40af, #7c3aed);
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            display: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-select-container {
            margin-top: 10px;
            width: 90%;
            max-width: 500px;
            display: none;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: #1f2937;
            color: #fff;
            border: 2px solid #374151;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        select:focus { border-color: #f97316; }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button { 
            padding: 14px 28px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            transition: transform 0.1s;
            -webkit-user-select: none;
            user-select: none;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

        .btn-secondary {
            background: #374151;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        canvas { display: none; }

        .https-warning {
            background: #7f1d1d;
            color: #fecaca;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .target-badge {
            display: inline-block;
            background: #1e40af;
            color: #dbeafe;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preview-container {
            margin-top: 15px;
            width: 90%;
            max-width: 500px;
            display: none;
            text-align: center;
        }

        .preview-container img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #374151;
        }

        .preview-info {
            font-size: 11px;
            color: #6b7280;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="https-warning" id="httpsWarning">
        ⚠️ Kamera WAJAL pakai HTTPS. Buka via <b>https://</b> atau <b>localhost</b>.
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted webkit-playsinline></video>
    </div>

    <div class="status" id="status">Meminta Izin Kamera...</div>
    <div class="camera-info" id="cameraInfo"></div>
    <div class="mood-result" id="moodResult"></div>
    <div class="target-badge">🎯 Target: FHD Camera (1bcf:28c4)</div>

    <div class="preview-container" id="previewContainer">
        <img id="previewImg" alt="Preview foto" />
        <div class="preview-info" id="previewInfo"></div>
    </div>

    <div class="camera-select-container" id="cameraSelectContainer">
        <select id="cameraSelect"></select>
    </div>

    <div class="button-row">
        <button id="captureBtn">📸 FOTO & DETEKSI</button>
        <button id="switchBtn" class="btn-secondary">🔄 Ganti Kamera</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const cameraInfoEl = document.getElementById("cameraInfo");
        const moodResultEl = document.getElementById("moodResult");
        const captureBtn = document.getElementById("captureBtn");
        const switchBtn = document.getElementById("switchBtn");
        const httpsWarning = document.getElementById("httpsWarning");
        const cameraSelect = document.getElementById("cameraSelect");
        const cameraSelectContainer = document.getElementById("cameraSelectContainer");
        const previewContainer = document.getElementById("previewContainer");
        const previewImg = document.getElementById("previewImg");
        const previewInfo = document.getElementById("previewInfo");
        
        const user_id = localStorage.getItem("user_id") || "guest";

        // ==========================================
        // KONFIGURASI API
        // ==========================================
        const API_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        
        // ==========================================
        // KONFIGURASI KAMERA
        // ==========================================
        const TARGET_CAMERA_KEYWORDS = [
            "1bcf", "28c4", "sunplus", "sonix", 
            "fhd", "usb camera", "webcam", "pc camera"
        ];
        const TARGET_RESOLUTION = { width: 1920, height: 1080 };
        const PREFERRED_DEVICE_ID = localStorage.getItem("preferred_camera_id") || null;

        let currentStream = null;
        let allCameras = [];

        // ==========================================
        // CEK HTTPS
        // ==========================================
        if (!window.isSecureContext) {
            httpsWarning.style.display = "block";
            statusEl.textContent = "⚠️ Butuh HTTPS! Kamera tidak akan jalan.";
            statusEl.style.color = "#ef4444";
        }

        // ==========================================
        // ENUMERATE & COCOKKAN KAMERA
        // ==========================================
        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                allCameras = devices.filter(d => d.kind === "videoinput");
                console.log("📹 Semua kamera:", allCameras);
                return allCameras;
            } catch (err) {
                console.error("Gagal enumerate:", err);
                return [];
            }
        }

        function findTargetCamera(cameras) {
            if (PREFERRED_DEVICE_ID) {
                const saved = cameras.find(c => c.deviceId === PREFERRED_DEVICE_ID);
                if (saved) return saved;
            }

            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) {
                        return cam;
                    }
                }
            }

            const front = cameras.find(c => {
                const label = (c.label || "").toLowerCase();
                return label.includes("front") || label.includes("depan");
            });
            if (front) return front;

            return cameras[0] || null;
        }

        // ==========================================
        // REQUEST CAMERA
        // ==========================================
        async function requestCamera(targetDeviceId = null) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.textContent = "Browser tidak mendukung kamera.";
                statusEl.style.color = "#ef4444";
                return;
            }

            statusEl.textContent = "🔍 Mencari kamera FHD...";

            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            if (!targetDeviceId) {
                try {
                    const tempStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" }, 
                        audio: false 
                    });
                    tempStream.getTracks().forEach(t => t.stop());

                    const cameras = await enumerateCameras();
                    const target = findTargetCamera(cameras);
                    
                    if (target) {
                        targetDeviceId = target.deviceId;
                        localStorage.setItem("preferred_camera_id", targetDeviceId);
                        populateCameraSelect(cameras, targetDeviceId);
                    }
                } catch (err) {
                    handleCameraError(err);
                    return;
                }
            }

            const constraintsList = [
                {
                    video: {
                        deviceId: { exact: targetDeviceId },
                        width: { ideal: TARGET_RESOLUTION.width },
                        height: { ideal: TARGET_RESOLUTION.height },
                        frameRate: { ideal: 30 }
                    },
                    audio: false
                },
                {
                    video: {
                        deviceId: { exact: targetDeviceId },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                },
                { video: { deviceId: { exact: targetDeviceId } }, audio: false },
                {
                    video: {
                        width: { ideal: TARGET_RESOLUTION.width },
                        height: { ideal: TARGET_RESOLUTION.height }
                    },
                    audio: false
                },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsList) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    break;
                } catch (err) {
                    lastError = err;
                }
            }

            if (!stream) {
                handleCameraError(lastError);
                return;
            }

            currentStream = stream;
            videoElement.srcObject = stream;

            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            
            cameraInfoEl.innerHTML = `
                📷 <b>${track.label || "Unknown Camera"}</b><br>
                Resolusi: ${settings.width}×${settings.height} @ ${settings.frameRate?.toFixed(1) || "?"}fps
            `;

            const isTarget = TARGET_CAMERA_KEYWORDS.some(kw => 
                (track.label || "").toLowerCase().includes(kw.toLowerCase())
            );
            if (isTarget) {
                statusEl.textContent = "✅ FHD Camera (1bcf:28c4) AKTIF";
                statusEl.style.color = "#22c55e";
            } else {
                statusEl.textContent = "⚠️ Kamera aktif (bukan target 1bcf:28c4)";
                statusEl.style.color = "#f59e0b";
            }

            videoElement.addEventListener("loadedmetadata", () => {
                videoElement.play()
                    .then(() => {
                        captureBtn.style.display = "inline-block";
                        switchBtn.style.display = "inline-block";
                    })
                    .catch(err => {
                        statusEl.textContent = "👆 Tap layar untuk aktifkan";
                    });
            }, { once: true });

            setTimeout(() => {
                if (videoElement.paused) videoElement.play().catch(() => {});
            }, 500);
        }

        function handleCameraError(err) {
            if (err?.name === "NotFoundError") {
                statusEl.textContent = "❌ Kamera tidak ditemukan.";
            } else if (err?.name === "NotAllowedError") {
                statusEl.textContent = "🔒 Izin ditolak.";
            } else if (err?.name === "NotReadableError") {
                statusEl.textContent = "⚠️ Kamera sedang dipakai app lain.";
            } else {
                statusEl.textContent = `❌ Error: ${err?.message || "Unknown"}`;
            }
            statusEl.style.color = "#ef4444";
        }

        // ==========================================
        // DROPDOWN PILIH KAMERA
        // ==========================================
        function populateCameraSelect(cameras, selectedId) {
            if (cameras.length <= 1) return;
            
            cameraSelect.innerHTML = "";
            cameras.forEach(cam => {
                const opt = document.createElement("option");
                opt.value = cam.deviceId;
                const isTarget = TARGET_CAMERA_KEYWORDS.some(kw => 
                    (cam.label || "").toLowerCase().includes(kw.toLowerCase())
                );
                opt.textContent = (isTarget ? "🎯 " : "") + (cam.label || "Camera");
                if (cam.deviceId === selectedId) opt.selected = true;
                cameraSelect.appendChild(opt);
            });
            cameraSelectContainer.style.display = "block";
        }

        cameraSelect.addEventListener("change", async (e) => {
            const deviceId = e.target.value;
            localStorage.setItem("preferred_camera_id", deviceId);
            statusEl.textContent = "🔄 Mengganti kamera...";
            await requestCamera(deviceId);
        });

        switchBtn.addEventListener("click", async () => {
            if (allCameras.length < 2) {
                statusEl.textContent = "Hanya ada 1 kamera.";
                return;
            }
            cameraSelectContainer.style.display = 
                cameraSelectContainer.style.display === "none" ? "block" : "none";
        });

        // ==========================================
        // TAP-TO-START (iOS FIX)
        // ==========================================
        let userInteracted = false;
        function handleFirstInteraction() {
            if (userInteracted) return;
            userInteracted = true;
            if (videoElement.paused && currentStream) {
                videoElement.play().catch(() => {});
            }
            document.removeEventListener("touchstart", handleFirstInteraction);
            document.removeEventListener("click", handleFirstInteraction);
        }
        document.addEventListener("touchstart", handleFirstInteraction, { passive: true });
        document.addEventListener("click", handleFirstInteraction);

        // ==========================================
        // VISIBILITY CHANGE
        // ==========================================
        document.addEventListener("visibilitychange", () => {
            if (!currentStream) return;
            currentStream.getTracks().forEach(t => t.enabled = !document.hidden);
        });

        // ==========================================
        // 📸 CAPTURE → JADIKAN FILE JPEG → KIRIM
        // ==========================================
        captureBtn.addEventListener("click", capture);

        function capture() {
            if (!currentStream) {
                statusEl.textContent = "Kamera belum aktif.";
                return;
            }

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            canvas.width = videoElement.videoWidth || 1920;
            canvas.height = videoElement.videoHeight || 1080;
            
            // Balik gambar agar tidak mirror
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            statusEl.innerHTML = '<span class="loading"></span>Membuat file JPEG...';
            captureBtn.disabled = true;
            moodResultEl.style.display = "none";

            // ✅ Convert canvas ke Blob JPEG, lalu kirim sebagai FILE
            canvas.toBlob(
                (blob) => {
                    if (!blob) {
                        statusEl.textContent = "❌ Gagal membuat file JPEG.";
                        captureBtn.disabled = false;
                        return;
                    }

                    // Tampilkan preview
                    const previewUrl = URL.createObjectURL(blob);
                    previewImg.src = previewUrl;
                    previewInfo.textContent = `📦 ${blob.type} • ${(blob.size / 1024).toFixed(1)} KB • ${canvas.width}×${canvas.height}px`;
                    previewContainer.style.display = "block";

                    // Kirim file JPEG ke API
                    sendJpegToApi(blob);
                },
                "image/jpeg",
                0.88 // kualitas JPEG (0-1)
            );
        }

        // ==========================================
        // 🚀 KIRIM FILE JPEG KE ANDRE ML
        // ==========================================
        async function sendJpegToApi(jpegBlob) {
            const startTime = Date.now();
            statusEl.innerHTML = '<span class="loading"></span>Mengirim foto ke Andre ML...';

            // Buat FormData (multipart/form-data) - seperti upload file biasa
            const formData = new FormData();
            
            // Nama field "image" adalah yang paling umum untuk API ML
            // Kita juga tambahkan field alternatif untuk fallback
            const timestamp = Date.now();
            const fileName = `mood_${user_id}_${timestamp}.jpg`;
            
            formData.append("image", jpegBlob, fileName);     // field utama
            formData.append("user_id", user_id);
            formData.append("timestamp", String(timestamp));

            try {
                // Percobaan 1: Kirim sebagai FormData (file JPEG)
                let response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    body: formData
                    // ⚠️ JANGAN set header Content-Type manual!
                    // Browser akan otomatis set dengan boundary yang benar
                });

                // Jika gagal, coba format JSON dengan base64 sebagai fallback
                if (!response.ok) {
                    console.warn("⚠️ FormData gagal, coba base64 JSON...");
                    response = await sendAsBase64Fallback(jpegBlob);
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const elapsed = Date.now() - startTime;
                
                console.log("📊 Response Andre ML:", data);
                console.log(`⏱️ Response time: ${elapsed}ms`);

                // Ekstrak mood
                const mood = extractMood(data);
                
                // Tampilkan hasil
                moodResultEl.textContent = `😊 Mood: ${mood}`;
                moodResultEl.style.display = "block";
                statusEl.textContent = `✅ Terdeteksi dalam ${elapsed}ms`;
                statusEl.style.color = "#22c55e";

                // Simpan ke backend (opsional)
                await sendToBackend(user_id, mood, data);

            } catch (err) {
                console.error("❌ Error Andre ML:", err);
                statusEl.textContent = `❌ Gagal: ${err.message}`;
                statusEl.style.color = "#ef4444";
            } finally {
                captureBtn.disabled = false;
            }
        }

        // ==========================================
        // 🔄 FALLBACK: KIRIM SEBAGAI BASE64 JSON
        // ==========================================
        async function sendAsBase64Fallback(jpegBlob) {
            return new Promise(async (resolve) => {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Full = reader.result;        // "data:image/jpeg;base64,..."
                    const base64Clean = base64Full.split(",")[1]; // hanya base64 string

                    // Coba beberapa format body
                    const bodies = [
                        { image: base64Clean, user_id },
                        { image: base64Full, user_id },
                        { photo: base64Clean, user_id },
                        { file: base64Clean, user_id }
                    ];

                    for (const body of bodies) {
                        try {
                            const res = await fetch(API_ENDPOINT, {
                                method: "POST",
                                headers: { 
                                    "Content-Type": "application/json",
                                    "Accept": "application/json"
                                },
                                body: JSON.stringify(body)
                            });
                            if (res.ok) {
                                resolve(res);
                                return;
                            }
                        } catch (e) {
                            continue;
                        }
                    }
                    
                    // Semua gagal, return response terakhir
                    resolve({ ok: false, status: 0, statusText: "Semua format gagal" });
                };
                reader.readAsDataURL(jpegBlob);
            });
        }

        // ==========================================
        // 🔍 EKSTRAK MOOD DARI RESPONSE
        // ==========================================
        function extractMood(data) {
            if (!data) return "unknown";
            
            const possibleFields = [
                "mood", "emotion", "result", "label", 
                "prediction", "class", "sentiment", "expression"
            ];

            // Cek top-level
            for (const field of possibleFields) {
                if (data[field] !== undefined && data[field] !== null) {
                    return String(data[field]);
                }
            }

            // Cek nested: data.data, data.result, data.prediction
            const nestedKeys = ["data", "result", "prediction", "response"];
            for (const key of nestedKeys) {
                if (data[key] && typeof data[key] === "object") {
                    for (const field of possibleFields) {
                        if (data[key][field]) return String(data[key][field]);
                    }
                }
            }

            // Fallback
            return JSON.stringify(data).substring(0, 40);
        }

        // ==========================================
        // 💾 SIMPAN KE BACKEND (OPSIONAL)
        // ==========================================
        async function sendToBackend(user_id, mood, rawData) {
            try {
                await fetch("https://api-anda.com/v1/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        user_id, 
                        mood,
                        raw_response: rawData,
                        timestamp: new Date().toISOString()
                    }),
                });
            } catch (err) {
                console.warn("⚠️ Gagal simpan ke backend:", err);
            }
        }

        // ==========================================
        // START
        // ==========================================
        window.addEventListener("load", () => requestCamera());

        window.addEventListener("beforeunload", () => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
