<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Capture Mood - Direct Access</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            background: #111;
            position: relative;
        }

        @media (min-width: 768px) {
            .video-container {
                max-width: 640px;
                aspect-ratio: 16 / 10;
            }
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
            background: #000;
        }

        .status { 
            margin-top: 15px;
            font-size: 14px; 
            color: #f97316; 
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }

        .camera-info {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            padding: 0 20px;
            max-width: 500px;
        }

        .mood-result {
            margin-top: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1e40af, #7c3aed);
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            display: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ✅ ERROR BOX - Lebih terlihat & scrollable */
        .error-box {
            margin: 15px 20px;
            padding: 16px;
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            border: 3px solid #dc2626;
            border-radius: 12px;
            font-size: 12px;
            text-align: left;
            display: none;
            max-width: 600px;
            width: 90%;
            color: #fff;
            animation: fadeIn 0.3s, pulse 2s infinite;
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.5);
            max-height: 400px;
            overflow-y: auto;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(220, 38, 38, 0.5); }
            50% { box-shadow: 0 0 50px rgba(220, 38, 38, 0.8); }
        }

        .error-box h4 {
            margin: 0 0 12px 0;
            color: #fca5a5;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-box .error-section {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border-left: 3px solid #fbbf24;
        }

        .error-box .error-label {
            color: #fbbf24;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .error-box .error-value {
            background: rgba(31, 41, 55, 0.8);
            padding: 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            word-break: break-all;
            color: #fbbf24;
            white-space: pre-wrap;
        }

        .error-box .error-highlight {
            background: rgba(251, 191, 36, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            color: #fde047;
            font-weight: bold;
        }

        .camera-select-container {
            margin-top: 10px;
            width: 90%;
            max-width: 500px;
            display: none;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            background: #1f2937;
            color: #fff;
            border: 2px solid #374151;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        select:focus { border-color: #f97316; }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        button { 
            padding: 14px 28px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            transition: transform 0.1s;
            -webkit-user-select: none;
            user-select: none;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

        .btn-secondary {
            background: #374151;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-danger {
            background: #dc2626;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            animation: shake 0.5s;
        }

        .btn-success {
            background: #16a34a;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.4);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        canvas { display: none; }

        .https-warning {
            background: #7f1d1d;
            color: #fecaca;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 13px;
            text-align: center;
            display: none;
            max-width: 500px;
        }

        .target-badge {
            display: inline-block;
            background: #1e40af;
            color: #dbeafe;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preview-container {
            margin-top: 15px;
            width: 90%;
            max-width: 500px;
            display: none;
            text-align: center;
        }

        .preview-container img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #374151;
        }

        .preview-info {
            font-size: 11px;
            color: #6b7280;
            margin-top: 6px;
        }

        .shortcut-hint {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #6b7280;
            display: none;
        }

        @media (min-width: 768px) {
            .shortcut-hint { display: block; }
        }

        .shortcut-hint kbd {
            background: #374151;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #4b5563;
        }

        /* Scroll indicator */
        .scroll-hint {
            text-align: center;
            color: #fbbf24;
            font-size: 11px;
            margin-top: 5px;
            animation: bounce 1s infinite;
            display: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="https-warning" id="httpsWarning">
        ⚠️ Kamera WAJIB pakai HTTPS. Buka via <b>https://</b> atau <b>localhost</b>.
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted webkit-playsinline></video>
    </div>

    <div class="status" id="status">Meminta Izin Kamera...</div>
    <div class="camera-info" id="cameraInfo"></div>
    <div class="mood-result" id="moodResult"></div>
    
    <!-- ✅ ERROR BOX - Lebih terlihat -->
    <div class="error-box" id="errorBox">
        <h4>❌ Error Detail - Gagal Menyimpan Rekomendasi</h4>
        <div id="errorContent"></div>
    </div>
    <div class="scroll-hint" id="scrollHint">⬇️ Scroll ke bawah untuk lihat detail error</div>
    
    <div class="target-badge">🎯 Target: FHD Camera</div>

    <div class="preview-container" id="previewContainer">
        <img id="previewImg" alt="Preview foto" />
        <div class="preview-info" id="previewInfo"></div>
    </div>

    <div class="camera-select-container" id="cameraSelectContainer">
        <select id="cameraSelect"></select>
    </div>

    <div class="button-row">
        <button id="captureBtn">📸 FOTO & DETEKSI</button>
        <button id="switchBtn" class="btn-secondary">🔄 Ganti Kamera</button>
        <button id="forceContinueBtn" class="btn-danger" style="display:none;">⏭️ Lanjut Paksa</button>
        <button id="retryBtn" class="btn-success" style="display:none;">🔁 Coba Lagi</button>
    </div>

    <div class="shortcut-hint">
        💡 Tekan <kbd>SPACE</kbd> untuk foto cepat
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const cameraInfoEl = document.getElementById("cameraInfo");
        const moodResultEl = document.getElementById("moodResult");
        const captureBtn = document.getElementById("captureBtn");
        const switchBtn = document.getElementById("switchBtn");
        const forceContinueBtn = document.getElementById("forceContinueBtn");
        const retryBtn = document.getElementById("retryBtn");
        const httpsWarning = document.getElementById("httpsWarning");
        const cameraSelect = document.getElementById("cameraSelect");
        const cameraSelectContainer = document.getElementById("cameraSelectContainer");
        const previewContainer = document.getElementById("previewContainer");
        const previewImg = document.getElementById("previewImg");
        const previewInfo = document.getElementById("previewInfo");
        const errorBox = document.getElementById("errorBox");
        const errorContent = document.getElementById("errorContent");
        const scrollHint = document.getElementById("scrollHint");
        
        const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";
        const ANDRE_ML_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        const BACKEND_BASE_URL = "http://127.0.0.1:8000";
        const RECOMMEND_ENDPOINT_BASE = `${BACKEND_BASE_URL}/recommend-external`;

        const TARGET_CAMERA_KEYWORDS = ["1bcf", "28c4", "sunplus", "sonix", "fhd", "usb camera", "webcam", "pc camera"];
        const TARGET_RESOLUTION = { width: 1920, height: 1080 };
        const PREFERRED_DEVICE_ID = localStorage.getItem("preferred_camera_id") || null;

        let currentStream = null;
        let allCameras = [];
        let lastDetectedMood = null;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // ==========================================
        // ✅ FUNGSI ERROR - Dengan auto-scroll
        // ==========================================
        function showError(title, details) {
            let html = `<h4>❌ ${title}</h4>`;
            
            for (const [label, value] of Object.entries(details)) {
                const displayValue = typeof value === 'object' 
                    ? JSON.stringify(value, null, 2) 
                    : String(value);
                
                // Highlight URL dan error penting
                let highlightedValue = displayValue;
                if (label.toLowerCase().includes('url') || label.toLowerCase().includes('endpoint')) {
                    highlightedValue = `<span class="error-highlight">${displayValue}</span>`;
                }
                
                html += `
                    <div class="error-section">
                        <span class="error-label">${label}</span>
                        <div class="error-value">${highlightedValue}</div>
                    </div>
                `;
            }
            
            errorContent.innerHTML = html;
            errorBox.style.display = "block";
            
            // Tampilkan hint scroll jika perlu
            setTimeout(() => {
                if (errorBox.scrollHeight > window.innerHeight * 0.4) {
                    scrollHint.style.display = "block";
                }
            }, 100);
            
            // Auto-scroll ke error box
            setTimeout(() => {
                errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
            
            retryBtn.style.display = "inline-block";
            forceContinueBtn.style.display = "inline-block";
        }

        function clearError() {
            errorBox.style.display = "none";
            errorContent.innerHTML = "";
            retryBtn.style.display = "none";
            forceContinueBtn.style.display = "none";
            scrollHint.style.display = "none";
        }

        if (!window.isSecureContext) {
            httpsWarning.style.display = "block";
            statusEl.textContent = "⚠️ Butuh HTTPS! Kamera tidak akan jalan.";
            statusEl.style.color = "#ef4444";
        }

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                allCameras = devices.filter(d => d.kind === "videoinput");
                return allCameras;
            } catch (err) {
                return [];
            }
        }

        function findTargetCamera(cameras) {
            if (PREFERRED_DEVICE_ID) {
                const saved = cameras.find(c => c.deviceId === PREFERRED_DEVICE_ID);
                if (saved) return saved;
            }
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) return cam;
                }
            }
            if (isMobile) {
                const front = cameras.find(c => {
                    const label = (c.label || "").toLowerCase();
                    return label.includes("front") || label.includes("depan");
                });
                if (front) return front;
            } else {
                const builtin = cameras.find(c => {
                    const label = (c.label || "").toLowerCase();
                    return label.includes("integrated") || label.includes("built-in") || label.includes("facetime");
                });
                if (builtin) return builtin;
            }
            return cameras[0] || null;
        }

        async function requestCamera(targetDeviceId = null) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.textContent = "Browser tidak mendukung kamera.";
                statusEl.style.color = "#ef4444";
                return;
            }

            statusEl.textContent = "🔍 Mencari kamera...";
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            if (!targetDeviceId) {
                try {
                    const tempConstraints = isMobile 
                        ? { video: { facingMode: "user" }, audio: false }
                        : { video: true, audio: false };
                    
                    const tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
                    tempStream.getTracks().forEach(t => t.stop());
                    
                    const cameras = await enumerateCameras();
                    const target = findTargetCamera(cameras);
                    
                    if (target) {
                        targetDeviceId = target.deviceId;
                        localStorage.setItem("preferred_camera_id", targetDeviceId);
                        populateCameraSelect(cameras, targetDeviceId);
                    }
                } catch (err) {
                    handleCameraError(err);
                    return;
                }
            }

            const constraintsList = [
                { video: { deviceId: { exact: targetDeviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false },
                { video: { deviceId: { exact: targetDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { deviceId: { exact: targetDeviceId } }, audio: false },
                { video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                { video: true, audio: false }
            ];

            let stream = null;
            let lastError = null;

            for (const constraints of constraintsList) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    break;
                } catch (err) {
                    lastError = err;
                    continue;
                }
            }

            if (!stream) {
                handleCameraError(lastError);
                return;
            }

            currentStream = stream;
            videoElement.srcObject = stream;
            
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();
            
            cameraInfoEl.innerHTML = `📷 <b>${track.label || "Unknown Camera"}</b><br>Resolusi: ${settings.width}×${settings.height} @ ${settings.frameRate?.toFixed(1) || "?"}fps`;
            statusEl.textContent = "✅ Kamera AKTIF";
            statusEl.style.color = "#22c55e";

            videoElement.addEventListener("loadedmetadata", () => {
                videoElement.play()
                    .then(() => {
                        captureBtn.style.display = "inline-block";
                        switchBtn.style.display = "inline-block";
                    })
                    .catch(() => {
                        statusEl.textContent = "👆 Tap/klik untuk aktifkan";
                    });
            }, { once: true });

            setTimeout(() => {
                if (videoElement.paused) videoElement.play().catch(() => {});
            }, 500);
        }

        function handleCameraError(err) {
            let errorMsg = "❌ ";
            if (err?.name === "NotFoundError") errorMsg += "Kamera tidak ditemukan.";
            else if (err?.name === "NotAllowedError") errorMsg += "Izin ditolak.";
            else if (err?.name === "NotReadableError") errorMsg += "Kamera sedang dipakai app lain.";
            else if (err?.name === "OverconstrainedError") errorMsg += "Resolusi tidak didukung.";
            else errorMsg += `Error: ${err?.message || "Unknown"}`;
            
            statusEl.textContent = errorMsg;
            statusEl.style.color = "#ef4444";
        }

        function populateCameraSelect(cameras, selectedId) {
            if (cameras.length <= 1) return;
            cameraSelect.innerHTML = "";
            cameras.forEach(cam => {
                const opt = document.createElement("option");
                opt.value = cam.deviceId;
                const isTarget = TARGET_CAMERA_KEYWORDS.some(kw => 
                    (cam.label || "").toLowerCase().includes(kw.toLowerCase())
                );
                opt.textContent = (isTarget ? "🎯 " : "") + (cam.label || "Camera");
                if (cam.deviceId === selectedId) opt.selected = true;
                cameraSelect.appendChild(opt);
            });
            cameraSelectContainer.style.display = "block";
        }

        cameraSelect.addEventListener("change", async (e) => {
            localStorage.setItem("preferred_camera_id", e.target.value);
            await requestCamera(e.target.value);
        });

        switchBtn.addEventListener("click", () => {
            cameraSelectContainer.style.display = 
                cameraSelectContainer.style.display === "none" ? "block" : "none";
        });

        let userInteracted = false;
        function handleFirstInteraction() {
            if (userInteracted) return;
            userInteracted = true;
            if (videoElement.paused && currentStream) videoElement.play().catch(() => {});
            document.removeEventListener("touchstart", handleFirstInteraction);
            document.removeEventListener("click", handleFirstInteraction);
        }
        document.addEventListener("touchstart", handleFirstInteraction, { passive: true });
        document.addEventListener("click", handleFirstInteraction);

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" && !captureBtn.disabled && captureBtn.style.display !== "none") {
                e.preventDefault();
                capture();
            }
        });

        retryBtn.addEventListener("click", () => {
            clearError();
            if (lastDetectedMood) {
                statusEl.textContent = `🔁 Mencoba ulang kirim mood: ${lastDetectedMood}`;
                sendRecommendation(lastDetectedMood, USER_ID_PLACEHOLDER);
            } else {
                capture();
            }
        });

        forceContinueBtn.addEventListener("click", () => {
            if (confirm("Lanjut ke halaman order tanpa menyimpan rekomendasi?")) {
                window.location.href = "index.html";
            }
        });

        captureBtn.addEventListener("click", capture);

        function capture() {
            if (!currentStream) {
                statusEl.textContent = "Kamera belum aktif.";
                return;
            }

            clearError();

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = videoElement.videoWidth || 1920;
            canvas.height = videoElement.videoHeight || 1080;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            statusEl.innerHTML = '<span class="loading"></span>Membuat file JPEG...';
            captureBtn.disabled = true;
            moodResultEl.style.display = "none";

            canvas.toBlob((blob) => {
                if (!blob) {
                    statusEl.textContent = "❌ Gagal membuat file JPEG.";
                    captureBtn.disabled = false;
                    return;
                }

                previewImg.src = URL.createObjectURL(blob);
                previewInfo.textContent = `📦 ${(blob.size / 1024).toFixed(1)} KB • ${canvas.width}×${canvas.height}px`;
                previewContainer.style.display = "block";

                sendToAndreML(blob);
            }, "image/jpeg", 0.85);
        }

        async function sendToAndreML(jpegBlob) {
            statusEl.innerHTML = '<span class="loading"></span>Menganalisis mood di Andre ML...';
            const formData = new FormData();
            formData.append("image", jpegBlob, `mood_${USER_ID_PLACEHOLDER}.jpg`);
            formData.append("user_id", USER_ID_PLACEHOLDER);

            try {
                const startTime = Date.now();
                const response = await fetch(ANDRE_ML_ENDPOINT, { 
                    method: "POST", 
                    body: formData 
                });
                const elapsed = Date.now() - startTime;
                
                console.log(`⏱️ Andre ML response time: ${elapsed}ms`);
                console.log(`📡 Andre ML status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    showError("Gagal Deteksi Mood (Andre ML)", {
                        "Endpoint": ANDRE_ML_ENDPOINT,
                        "HTTP Status": `${response.status} ${response.statusText}`,
                        "Response Time": `${elapsed}ms`,
                        "Response Body": errorText || "(kosong)"
                    });
                    statusEl.textContent = "❌ Gagal deteksi mood.";
                    statusEl.style.color = "#ef4444";
                    captureBtn.disabled = false;
                    return;
                }
                
                const data = await response.json();
                console.log("📊 Response Andre ML:", data);

                const mood = extractMood(data);
                lastDetectedMood = mood;
                moodResultEl.textContent = `😊 Mood: ${mood}`;
                moodResultEl.style.display = "block";
                
                await sendRecommendation(mood, USER_ID_PLACEHOLDER);

            } catch (err) {
                console.error("❌ Error Andre ML:", err);
                showError("Error Koneksi ke Andre ML", {
                    "Endpoint": ANDRE_ML_ENDPOINT,
                    "Error Type": err.name || "Unknown",
                    "Error Message": err.message,
                    "Kemungkinan Penyebab": "CORS, network error, atau server down"
                });
                statusEl.textContent = "❌ Gagal deteksi mood.";
                statusEl.style.color = "#ef4444";
                captureBtn.disabled = false;
            }
        }

        async function sendRecommendation(mood, user_id) {
            const safeMood = encodeURIComponent(mood.trim().toLowerCase());
            const safeUserId = encodeURIComponent(user_id);
            const targetUrl = `${RECOMMEND_ENDPOINT_BASE}/${safeMood}/${safeUserId}`;

            console.log(`🚀 Mengirim rekomendasi ke: ${targetUrl}`);
            statusEl.innerHTML = '<span class="loading"></span>Menyimpan rekomendasi...';

            const startTime = Date.now();
            let lastRes = null;
            let lastMethod = null;
            let lastErrorText = "";
            let lastErrorObj = null;

            try {
                lastMethod = "POST";
                lastRes = await fetch(targetUrl, {
                    method: "POST", 
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: user_id, mood: mood })
                });
                lastErrorText = await lastRes.text();
                
                console.log(`📡 POST response: ${lastRes.status} ${lastRes.statusText}`);
                console.log(`📄 POST body:`, lastErrorText);
                
                if (lastRes.ok) {
                    const elapsed = Date.now() - startTime;
                    console.log(`✅ Rekomendasi berhasil disimpan dalam ${elapsed}ms`);
                    statusEl.textContent = `✅ Berhasil! Mengalihkan ke order...`;
                    statusEl.style.color = "#22c55e";
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                    return;
                }
            } catch (err) {
                console.warn("⚠️ POST error:", err);
                lastErrorObj = err;
                lastErrorText = err.message;
            }

            try {
                lastMethod = "GET (fallback)";
                lastRes = await fetch(targetUrl, { method: "GET" });
                lastErrorText = await lastRes.text();
                
                console.log(`📡 GET response: ${lastRes.status} ${lastRes.statusText}`);
                console.log(`📄 GET body:`, lastErrorText);
                
                if (lastRes.ok) {
                    const elapsed = Date.now() - startTime;
                    console.log(`✅ Rekomendasi berhasil disimpan (GET) dalam ${elapsed}ms`);
                    statusEl.textContent = `✅ Berhasil! Mengalihkan ke order...`;
                    statusEl.style.color = "#22c55e";
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                    return;
                }
            } catch (err) {
                console.warn("⚠️ GET error:", err);
                lastErrorObj = err;
                lastErrorText = err.message;
            }

            console.error("❌ Gagal menyimpan rekomendasi");
            
            const errorDetails = {
                "🎯 Target URL": targetUrl,
                "😊 Mood Terdeteksi": mood,
                "👤 User ID": user_id,
                "📡 Method Terakhir": lastMethod,
                "🔢 HTTP Status": lastRes ? `${lastRes.status} ${lastRes.statusText}` : "N/A",
                "📄 Response Body": lastErrorText || "(kosong)",
                "🌐 Backend URL": BACKEND_BASE_URL,
            };

            if (lastErrorObj) {
                errorDetails["⚠️ Error Type"] = lastErrorObj.name || "Unknown";
                errorDetails["💬 Error Message"] = lastErrorObj.message;
                
                if (lastErrorObj.message?.includes("Failed to fetch") || lastErrorObj.message?.includes("NetworkError")) {
                    errorDetails["🔍 Kemungkinan Penyebab"] = 
                        "1. Backend tidak reachable dari browser\n" +
                        "2. CORS tidak diizinkan (backend HTTP, halaman HTTPS) ← PALING MUNGKIN!\n" +
                        "3. Firewall memblokir port 8067\n" +
                        "4. Backend sedang down\n\n" +
                        "💡 Solusi: Setup HTTPS di backend atau pakai Cloudflare Tunnel";
                } else if (lastRes?.status === 0) {
                    errorDetails["🔍 Kemungkinan Penyebab"] = 
                        "CORS error - backend tidak mengirim header Access-Control-Allow-Origin";
                }
            }

            showError("Gagal Menyimpan Rekomendasi", errorDetails);
            
            statusEl.textContent = "❌ Gagal simpan. Lihat detail error di bawah.";
            statusEl.style.color = "#ef4444";
            
            captureBtn.disabled = false;
        }

        function extractMood(data) {
            if (!data) return "neutral";
            const fields = ["mood", "emotion", "result", "label", "prediction", "class", "sentiment", "expression"];
            
            for (const field of fields) {
                if (data[field]) return String(data[field]);
                if (data.data && data.data[field]) return String(data.data[field]);
                if (data.result && data.result[field]) return String(data.result[field]);
            }
            return "neutral";
        }

        window.addEventListener("load", () => requestCamera());
        window.addEventListener("beforeunload", () => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
