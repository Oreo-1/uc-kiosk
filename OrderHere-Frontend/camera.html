<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Capture Mood - Mobile & Tablet</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        /* MODAL PAKSA IZIN */
        #permissionModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 30px;
            display: none; 
        }

        .modal-content {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #f97316;
            width: 100%;
            max-width: 320px;
        }

        .video-container { 
            width: 90%; 
            max-width: 500px; 
            aspect-ratio: 4 / 5; /* HP biasanya lebih tinggi */
            border-radius: 15px; 
            overflow: hidden; 
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
            transition: border-color 0.5s;
            position: relative;
            background: #111;
        }

        .video-container.connected { border-color: #f97316; }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Agar video memenuhi container di HP */
            transform: scaleX(-1); /* Efek cermin untuk kamera depan */
        }

        .status-text { 
            font-size: 16px; 
            font-weight: bold; 
            color: #f97316; 
            margin: 20px 0; 
            text-align: center;
            padding: 0 20px;
        }

        .btn-orange { 
            padding: 16px 32px; 
            background: #f97316; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-switch {
            margin-top: 10px;
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        #captureBtn { display: none; margin-top: 10px; width: 80%; max-width: 300px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- MODAL UNTUK MEMAKSA IZIN -->
    <div id="permissionModal">
        <div class="modal-content">
            <h2 style="color: #f97316; margin-top: 0;">Akses Kamera</h2>
            <p style="font-size: 14px; line-height: 1.5;">Aplikasi membutuhkan izin kamera untuk mendeteksi mood wajah Anda.</p>
            <p style="font-size: 12px; color: #888;">Klik "Izinkan" atau "Allow" saat diminta oleh browser.</p>
            <br>
            <button class="btn-orange" onclick="retryPermission()">AKTIFKAN SEKARANG</button>
        </div>
    </div>

    <div class="video-container" id="vidContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status-text">Menyiapkan Kamera...</div>
    
    <button id="captureBtn" class="btn-orange" onclick="capture()">AMBIL FOTO</button>
    
    <!-- Tombol ganti kamera jika di HP ada depan/belakang -->
    <button class="btn-switch" onclick="switchCamera()">Ganti Kamera</button>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("video");
        const statusEl = document.getElementById("status");
        const captureBtn = document.getElementById("captureBtn");
        const vidContainer = document.getElementById("vidContainer");
        const permissionModal = document.getElementById("permissionModal");

        let currentFacingMode = "user"; // "user" = kamera depan, "environment" = kamera belakang

        function retryPermission() {
            location.reload(); 
        }

        async function initCamera() {
            // Hentikan stream yang sudah ada jika ingin ganti kamera
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            try {
                statusEl.textContent = "Membuka kamera...";
                
                const constraints = { 
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false 
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                permissionModal.style.display = "none";
                video.srcObject = stream;
                
                // Mirroring hanya untuk kamera depan
                video.style.transform = currentFacingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
                
                statusEl.textContent = "KAMERA SIAP";
                statusEl.style.color = "#22c55e";
                vidContainer.classList.add("connected");
                captureBtn.style.display = "block";

            } catch (err) {
                console.error("Camera Error:", err);
                showPermissionModal();
            }
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            initCamera();
        }

        function showPermissionModal() {
            permissionModal.style.display = "flex";
            statusEl.textContent = "IZIN KAMERA DITOLAK";
            statusEl.style.color = "#ef4444";
        }

        function capture() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            // Samakan ukuran canvas dengan video asli
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Balik gambar jika menggunakan kamera depan agar hasil foto tidak terbalik (seperti cermin)
            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64 = canvas.toDataURL("image/png");
            
            // Animasi flash sederhana
            vidContainer.style.opacity = "0.5";
            setTimeout(() => vidContainer.style.opacity = "1", 100);

            alert("Foto Berhasil Diambil!");
            console.log("Image data:", base64);
        }

        window.onload = initCamera;
    </script>
</body>
</html>
