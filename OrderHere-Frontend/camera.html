<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <title>Capture Mood</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #ffffff; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow: hidden;
        }

        .video-container { 
            width: 100%; 
            max-width: 600px; 
            aspect-ratio: 4 / 3; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 4px solid #f97316;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
            background: #f3f4f6;
            position: relative;
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Tampilan Hasil Mood */
        #moodResult {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #ea580c;
            text-transform: uppercase;
            min-height: 40px;
        }

        .capture-btn { 
            margin-top: 20px;
            padding: 20px 50px; 
            background: linear-gradient(135deg, #f97316, #ea580c); 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
            transition: all 0.2s ease;
        }

        .capture-btn:active { transform: scale(0.92); }
        .capture-btn:disabled { background: #d1d5db; opacity: 0.7; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- Area untuk mencetak hasil mood -->
    <div id="moodResult"></div>

    <button class="capture-btn" id="captureBtn">Capture Mood</button>

    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById("video");
        const captureBtn = document.getElementById("captureBtn");
        const moodResultDiv = document.getElementById("moodResult");

        const USER_ID_PLACEHOLDER = "12cc0214-e266-4d1a-8c1d-b287e6c5a1f1";
        const ANDRE_ML_ENDPOINT = "https://ai.moodbites.qzz.io/detect-mood";
        const TARGET_CAMERA_KEYWORDS = ["1bcf", "28c4", "sunplus", "sonix", "fhd", "usb camera", "webcam", "pc camera"];

        let currentStream = null;

        async function enumerateCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                return devices.filter(d => d.kind === "videoinput");
            } catch { return []; }
        }

        function findTargetCamera(cameras) {
            for (const cam of cameras) {
                const label = (cam.label || "").toLowerCase();
                for (const keyword of TARGET_CAMERA_KEYWORDS) {
                    if (label.includes(keyword.toLowerCase())) return cam;
                }
            }
            return cameras[0] || null;
        }

        async function requestCamera() {
            if (!navigator.mediaDevices?.getUserMedia) return;
            try {
                const cameras = await enumerateCameras();
                const target = findTargetCamera(cameras);
                const constraints = { 
                    video: target ? { facingMode: "user" } : { facingMode: "user" },
                    audio: false 
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (e) { console.error(e); }
        }

        function capture() {
            if (!currentStream) return;
            captureBtn.disabled = true;
            captureBtn.innerText = "Analyzing...";
            moodResultDiv.innerText = "Detecting...";

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = videoElement.videoWidth / 2; 
            canvas.height = videoElement.videoHeight / 2;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (blob) sendToML(blob);
                else captureBtn.disabled = false;
            }, "image/jpeg", 0.8);
        }

        async function sendToML(jpegBlob) {
            const formData = new FormData();
            formData.append("image", jpegBlob, "mood.jpg");
            formData.append("user_id", USER_ID_PLACEHOLDER);

            try {
                const response = await fetch(ANDRE_ML_ENDPOINT, { method: "POST", body: formData });
                const data = await response.json();
                
                // Ambil Mood dari API
                const mood = (data.mood || data.result || "neutral").toLowerCase();
                
                // 1. Simpan ke LocalStorage
                localStorage.setItem("mood", mood);

                // 2. Cetak ke HTML (Tampilkan ke User)
                moodResultDiv.innerText = "Mood: " + mood;


                // 4. Redirect ke order.html setelah 1.5 detik agar user sempat melihat hasilnya
                setTimeout(() => {
                    window.location.href = "order.html";
                }, 1500);

            } catch (error) {
                console.error(error);
                moodResultDiv.innerText = "Error Detecting Mood";
                captureBtn.disabled = false;
                captureBtn.innerText = "Capture Mood";
            }
        }

        captureBtn.addEventListener("click", capture);
        window.addEventListener("load", requestCamera);
    </script>
</body>
</html>
