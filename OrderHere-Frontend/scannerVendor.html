<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderHere | Vendor Pro Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 450px; margin: auto; border-radius: 20px; overflow: hidden; }
        .result-box { margin-top: 20px; padding: 20px; border-radius: 20px; display: none; text-align: left; }
        .valid { background: #065f46; border: 2px solid #34d399; }
        .invalid { background: #7f1d1d; border: 2px solid #f87171; }
        .order-details { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .label { font-size: 12px; color: #a7f3d0; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 18px; margin-bottom: 10px; display: block; }
        .btn-next { width: 100%; padding: 15px; background: #334155; border: none; color: white; border-radius: 10px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Vendor Order Check</h2>
    <div id="reader"></div>

    <div id="result" class="result-box">
        <h3 id="status-title" style="text-align:center; margin-bottom: 15px;">-</h3>
        
        <div class="order-details" id="details-panel" style="display:none;">
            <span class="label">Menu Pesanan:</span>
            <span class="value" id="res-items">...</span>
            
            <span class="label">Catatan Pelanggan:</span>
            <span class="value" id="res-notes">-</span>

            <span class="label">No. Antrian / Total:</span>
            <span class="value" id="res-meta">...</span>
        </div>

        <button class="btn-next" onclick="resetScanner()">Scan Next Order</button>
    </div>

    <script>
        // CONFIG
        const RPC_URL = "https://eth-sepolia.g.alchemy.com/v2/dS-WP2eW36UzHIeWIxnoQ";
        const CONTRACT_ADDRESS = "0x269691dd5963696515612673aE89aa18d0AdA189";
        const LARAVEL_API = "https://backend.orderhere.dpdns.org/api/orders/by-hash/";
        const ABI = ["function getOrderStatus(bytes32 _orderHash) external view returns (bool exists, bool isClaimed, uint256 time, address vendor)"];

        async function verifyAndFetch(scannedHash) {
            const resultBox = document.getElementById('result');
            const title = document.getElementById('status-title');
            const detailsPanel = document.getElementById('details-panel');

            resultBox.style.display = "block";
            title.innerText = "Verifying Blockchain...";

            try {
                // 1. STEP ONE: CHECK BLOCKCHAIN (SECURITY)
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
                const status = await contract.getOrderStatus(scannedHash);

                if (!status.exists) {
                    resultBox.className = "result-box invalid";
                    title.innerText = "❌ FAKE RECEIPT DETECTED";
                    detailsPanel.style.display = "none";
                    return;
                }
                
                if (status.isClaimed) {
                    resultBox.className = "result-box invalid";
                    title.innerText = "⚠️ RECEIPT ALREADY USED";
                    detailsPanel.style.display = "none";
                    return;
                }

                // 2. STEP TWO: FETCH FROM LARAVEL (DATA)
                title.innerText = "Fetching Order Details...";
                const response = await fetch(LARAVEL_API + scannedHash);
                const result = await response.json();

                if (result.success) {
                    resultBox.className = "result-box valid";
                    title.innerText = "✅ VALID & VERIFIED";
                    detailsPanel.style.display = "block";
                    
                    document.getElementById('res-items').innerText = result.data.items;
                    document.getElementById('res-notes').innerText = result.data.notes || "Tidak ada catatan";
                    document.getElementById('res-meta').innerText = `Antrian #${result.data.queue_number} | Rp ${result.data.total_price}`;
                }

            } catch (err) {
                title.innerText = "System Error: " + err.message;
            }
        }

        const html5QrCode = new Html5Qrcode("reader");
        function startScanner() {
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (hash) => {
                html5QrCode.pause();
                verifyAndFetch(hash);
            });
        }

        function resetScanner() {
            document.getElementById('result').style.display = "none";
            html5QrCode.resume();
        }

        window.onload = startScanner;
    </script>
</body>
</html>
