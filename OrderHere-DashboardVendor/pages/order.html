<style>
  .page-order {
    min-height: 100vh;
    background: #fff;
    position: relative;
  }
  .page-order .page-content {
    padding: 30px 40px;
  }
  .page-order .title {
    background: linear-gradient(90deg, #ffa83f 0%, #ff5e25 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 40px;
    font-weight: 700;
  }
  .page-order .subtitle {
    font-size: 24px;
    color: #333;
    margin-bottom: 20px;
  }
  .page-order .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }
  .page-order .filters button {
    padding: 8px 14px;
    border: 1.5px solid #ff8a35;
    background: white;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .page-order .filters button.active {
    background: linear-gradient(90deg, #ffa83f 0%, #ff5e25 100%);
    color: white;
    border: none;
  }
  .page-order .order-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 900px;
  }
  .page-order .card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    border: 1px solid #eee;
    transition: 0.2s;
  }
  .page-order .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }
  .page-order .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .page-order .badge {
    color: white;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .page-order .badge-PENDING {
    background: #3396ff;
  }
  .page-order .badge-ONPROGRESS {
    background: #ffcc00;
    color: #333;
  }
  .page-order .badge-DIANTAR {
    background: #ff8a35;
  }
  .page-order .badge-DONE {
    background: #28a745;
  }
  .page-order .badge-CANCELLED {
    background: #dc3545;
  }
  .page-order .order-info {
    text-align: right;
  }
  .page-order .order-number {
    font-size: 20px;
    font-weight: bold;
    display: block;
  }
  .page-order .order-time {
    font-size: 13px;
    color: #888;
  }
  .page-order .location {
    font-size: 18px;
    font-weight: 700;
    margin: 10px 0;
  }
  .page-order .dining-type {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
  }
  .page-order .item-list {
    color: #666;
    font-size: 15px;
  }
  .page-order .item {
    display: flex;
    justify-content: space-between;
    margin: 3px 0;
  }
  .page-order .item-notes {
    font-size: 12px;
    color: #999;
    font-style: italic;
    margin-left: 20px;
  }
  .page-order .divider {
    border-bottom: 2px dotted #ddd;
    margin: 15px 0;
  }
  .page-order .total-price {
    text-align: right;
    font-size: 18px;
    font-weight: bold;
  }
  .page-order .card-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .page-order .action-btn {
    padding: 8px 18px;
    border: 1.5px solid #ffcc00;
    background: white;
    color: #ffb300;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .page-order .cancel-btn {
    padding: 8px 18px;
    border: 1.5px solid #dc3545;
    background: white;
    color: #dc3545;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .page-order .loading {
    text-align: center;
    padding: 40px;
    color: #666;
  }
  .page-order .loading i {
    font-size: 32px;
    animation: spino 1s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spino {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
  .page-order .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .page-order .empty-state i {
    font-size: 64px;
    margin-bottom: 20px;
    opacity: 0.3;
  }
</style>

<div class="page-order">
  <div class="page-content">
    <div class="title">Pesanan</div>
    <div class="subtitle"><strong>Kelola</strong> pesanan masuk</div>

    <div class="filters">
      <button class="active" data-status="all">Semua</button>
      <button data-status="PENDING">Pesanan Baru</button>
      <button data-status="ONPROGRESS">Sedang Dipersiapkan</button>
      <button data-status="DIANTAR">Diantar</button>
      <button data-status="DONE">Selesai</button>
      <button data-status="CANCELLED">Dibatalkan</button>
    </div>

    <div class="order-container" id="orderContainer">
      <div class="loading">
        <i class="fas fa-spinner"></i>
        <p>Memuat pesanan...</p>
      </div>
    </div>
  </div>
</div>

<script>
  if (typeof requireAuth === "function" && !requireAuth()) {
    window.location.href = "pages/login.html";
  }

  let allOrders = [];
  let currentFilter = "all";
  let refreshInterval = null;

  const STATUS_MAP = {
    PENDING: "Pesanan Baru",
    ONPROGRESS: "Sedang Dipersiapkan",
    DIANTAR: "Diantar",
    DONE: "Selesai",
    CANCELLED: "Dibatalkan",
  };
  const BUTTON_MAP = {
    PENDING: { text: "Siapkan Pesanan", next: "ONPROGRESS" },
    ONPROGRESS: { text: "Antar Pesanan", next: "DIANTAR" },
    DIANTAR: { text: "Selesaikan Pesanan", next: "DONE" },
    DONE: null,
    CANCELLED: null,
  };

  // ✅ INIT LANGSUNG
  loadOrders();
  setupFilters();
  refreshInterval = setInterval(loadOrders, 30000);

  // ✅ CLEANUP: dipanggil otomatis oleh index.html saat pindah halaman
  window.cleanupCurrentPage = function () {
    if (refreshInterval) {
      clearInterval(refreshInterval);
      refreshInterval = null;
      console.log("[order] interval cleared");
    }
  };

  async function loadOrders() {
    try {
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.ORDERS}?per_page=100`,
      );
      if (data.success) {
        allOrders = data.data;
        renderOrders();
      } else showError("Gagal memuat pesanan");
    } catch (e) {
      console.error(e);
      showError("Gagal terhubung ke server");
    }
  }

  function setupFilters() {
    document.querySelectorAll(".page-order .filters button").forEach((btn) => {
      btn.addEventListener("click", function () {
        document
          .querySelectorAll(".page-order .filters button")
          .forEach((b) => b.classList.remove("active"));
        this.classList.add("active");
        currentFilter = this.dataset.status;
        renderOrders();
      });
    });
  }

  function renderOrders() {
    const container = document.getElementById("orderContainer");
    if (!container) return;
    let filtered =
      currentFilter === "all"
        ? allOrders
        : allOrders.filter((o) => o.status === currentFilter);
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><h3>Tidak ada pesanan</h3><p>${currentFilter === "all" ? "Belum ada pesanan masuk" : "Tidak ada pesanan dengan status ini"}</p></div>`;
      return;
    }
    container.innerHTML = filtered.map(renderOrderCard).join("");
  }

  function renderOrderCard(order) {
    const statusLabel = STATUS_MAP[order.status] || order.status;
    const buttonConfig = BUTTON_MAP[order.status];
    const canCancel = ["PENDING", "ONPROGRESS", "DIANTAR"].includes(
      order.status,
    );
    const orderTime = new Date(order.created_at).toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit",
    });
    const foodItems = order.foods
      .map((f) => {
        const qty = f.pivot ? f.pivot.quantity : 1;
        const notes = f.pivot && f.pivot.notes ? f.pivot.notes : "";
        return `<div class="item"><span>${f.name}</span><span>x${qty}</span></div>${notes ? `<div class="item-notes">📝 ${notes}</div>` : ""}`;
      })
      .join("");
    let buttons = "";
    if (buttonConfig)
      buttons += `<button class="action-btn" onclick="updateOrderStatus(${order.id}, '${buttonConfig.next}')">${buttonConfig.text}</button>`;
    if (canCancel)
      buttons += `<button class="cancel-btn" onclick="cancelOrder(${order.id})">Batalkan</button>`;
    return `
      <div class="card">
        <div class="card-header">
          <div class="badge badge-${order.status}">${statusLabel}</div>
          <div class="order-info"><span class="order-number">#${order.queue_number}</span><span class="order-time">${orderTime}</span></div>
        </div>
        <div class="card-body">
          <h3 class="location">${order.notes_order || "Tidak ada catatan"}</h3>
          <div class="dining-type">📍 ${order.dining_type}</div>
          <div class="item-list">${foodItems}</div>
          <div class="divider"></div>
          <div class="total-price">${formatRp(order.total_price)}</div>
        </div>
        <div class="card-footer">${buttons}</div>
      </div>`;
  }

  async function updateOrderStatus(orderId, newStatus) {
    if (!confirm(`Ubah status pesanan menjadi ${STATUS_MAP[newStatus]}?`))
      return;
    try {
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.ORDER_UPDATE_STATUS}/${orderId}/status`,
        {
          method: "PATCH",
          body: JSON.stringify({ status: newStatus }),
        },
      );
      if (data.success) {
        showSuccess(`Status diubah ke ${STATUS_MAP[newStatus]}`);
        await loadOrders();
      } else showError(data.message || "Gagal mengubah status");
    } catch (e) {
      console.error(e);
      showError("Gagal terhubung ke server");
    }
  }

  async function cancelOrder(orderId) {
    if (!confirm("Yakin ingin membatalkan pesanan ini?")) return;
    try {
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.ORDER_UPDATE_STATUS}/${orderId}/status`,
        {
          method: "PATCH",
          body: JSON.stringify({ status: "CANCELLED" }),
        },
      );
      if (data.success) {
        showSuccess("Pesanan dibatalkan");
        await loadOrders();
      } else showError(data.message || "Gagal membatalkan");
    } catch (e) {
      console.error(e);
      showError("Gagal terhubung ke server");
    }
  }

  function showSuccess(m) {
    showToast(m, "success");
  }
  function showError(m) {
    showToast(m, "error");
  }
  // showToast sudah global dari index.html, tidak perlu definisikan lagi
</script>
