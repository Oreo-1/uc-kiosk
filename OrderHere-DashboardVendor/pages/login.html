<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Chick on Cup</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        background: #cccccc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 100%;
        max-width: 1000px;
        min-height: 100vh;
        background: white;
        display: flex;
        overflow: hidden;
      }
      .left-side {
        width: 50%;
        background: linear-gradient(180deg, #ffa83f 0%, #ff5e25 100%);
        color: white;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        font-size: 42px;
        font-weight: 800;
        margin-bottom: 20px;
      }
      .left-side h2 {
        font-size: 36px;
        margin-bottom: 15px;
      }
      .left-side p {
        font-size: 16px;
        line-height: 1.7;
      }
      .right-side {
        width: 50%;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .form-container {
        width: 100%;
        max-width: 360px;
      }
      .title {
        background: linear-gradient(90deg, #ffa83f 0%, #ff5e25 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 38px;
        font-weight: 800;
        margin-bottom: 10px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
      }
      .input-group {
        margin-bottom: 18px;
      }
      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .input-box {
        position: relative;
      }
      .input-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
      }
      .input-box input {
        width: 100%;
        padding: 14px 45px 14px 45px;
        border-radius: 14px;
        border: 1.5px solid #eee;
        background: #fafafa;
        outline: none;
        font-size: 14px;
      }
      .input-box input:focus {
        border-color: #ff8a35;
        background: white;
      }

      /* ✅ Password Toggle Button */
      .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        cursor: pointer;
        background: none;
        border: none;
        font-size: 14px;
        padding: 5px;
      }
      .toggle-password:hover {
        color: #ff5e25;
      }

      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(90deg, #ffa83f 0%, #ff5e25 100%);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      /* ✅ Loading Spinner */
      .btn-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: none;
      }
      .btn.loading .btn-spinner {
        display: block;
      }
      .btn.loading .btn-text {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .switch-text {
        margin-top: 22px;
        text-align: center;
        color: #666;
      }
      .switch-text a {
        color: #ff7a2f;
        text-decoration: none;
        font-weight: 700;
      }
      .switch-text a:hover {
        text-decoration: underline;
      }

      .error-message {
        background: #fee2e2;
        color: #dc2626;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        font-size: 13px;
        display: none;
        border-left: 4px solid #dc2626;
      }
      .error-message.show {
        display: block;
        animation: slideIn 0.3s ease;
      }
      .success-message {
        background: #d1fae5;
        color: #059669;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        font-size: 13px;
        display: none;
        border-left: 4px solid #059669;
      }
      .success-message.show {
        display: block;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
        .left-side,
        .right-side {
          width: 100%;
        }
        .left-side {
          min-height: 260px;
          text-align: center;
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <h2>Welcome Back 👋</h2>
        <p>
          Login untuk mengelola pesanan dan menikmati pengalaman pemesanan yang
          cepat dan praktis.
        </p>
      </div>
      <div class="right-side">
        <div class="form-container">
          <div class="title">Login</div>
          <div class="subtitle">Please login to continue</div>
          <div class="error-message" id="errorMsg"></div>
          <div class="success-message" id="successMsg"></div>
          <form id="loginForm">
            <div class="input-group">
              <label>Nama Vendor</label>
              <div class="input-box">
                <i class="fa fa-user"></i>
                <input
                  type="text"
                  id="nameInput"
                  placeholder="Masukkan nama vendor"
                  required
                  autocomplete="username"
                />
              </div>
            </div>
            <div class="input-group">
              <label>Password</label>
              <div class="input-box">
                <i class="fa fa-lock"></i>
                <input
                  type="password"
                  id="passwordInput"
                  placeholder="Masukkan password"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="toggle-password"
                  onclick="togglePassword('passwordInput', this)"
                >
                  <i class="fa fa-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn" id="loginBtn">
              <div class="btn-spinner"></div>
              <span class="btn-text">Login</span>
            </button>
          </form>
          <div class="switch-text">
            Belum punya akun? <a href="signup.html">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/config.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (isAuthenticated()) {
          window.location.href = "../index.html";
          return;
        }

        const form = document.getElementById("loginForm");
        const nameInput = document.getElementById("nameInput");
        const passwordInput = document.getElementById("passwordInput");
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");
        const successMsg = document.getElementById("successMsg");

        // ✅ Auto-focus first input
        nameInput.focus();

        // ✅ Check for success message from signup
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("registered") === "1") {
          showSuccess("Registrasi berhasil! Silakan login.");
        }

        function showError(message) {
          errorMsg.textContent = message;
          errorMsg.classList.add("show");
          successMsg.classList.remove("show");
        }

        function showSuccess(message) {
          successMsg.textContent = message;
          successMsg.classList.add("show");
          errorMsg.classList.remove("show");
        }

        function hideMessages() {
          errorMsg.classList.remove("show");
          successMsg.classList.remove("show");
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          hideMessages();

          const name = nameInput.value.trim();
          const password = passwordInput.value;

          if (!name || !password) {
            showError("Mohon isi nama vendor dan password!");
            return;
          }

          // ✅ Set loading state
          loginBtn.disabled = true;
          loginBtn.classList.add("loading");

          try {
            const response = await fetch(
              `${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.LOGIN}`,
              {
                method: "POST",
                headers: {
                  Accept: "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ name, password }),
              },
            );

            const data = await response.json();

            if (response.ok && data.success && data.data && data.data.token) {
              setToken(data.data.token);
              setVendorData(data.data.vendor);
              showSuccess("Login berhasil! Mengalihkan...");

              setTimeout(() => {
                window.location.href = "../index.html";
              }, 1000);
            } else {
              const errorMessage =
                data.message || "Login gagal! Periksa nama dan password Anda.";
              showError(errorMessage);
              console.error("Login failed:", data);
            }
          } catch (error) {
            console.error("Login error:", error);
            showError(
              error.message ||
                "Terjadi kesalahan koneksi. Pastikan backend sudah berjalan.",
            );
          } finally {
            loginBtn.disabled = false;
            loginBtn.classList.remove("loading");
          }
        });

        nameInput.addEventListener("input", hideMessages);
        passwordInput.addEventListener("input", hideMessages);
      });

      // ✅ Password Toggle Function
      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }
    </script>
  </body>
</html>
