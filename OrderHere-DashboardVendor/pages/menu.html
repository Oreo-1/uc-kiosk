<style>
  /* Scope halaman menu */
  .page-menu {
    min-height: 100vh;
    background: #fff;
    position: relative;
    font-family: "Montserrat", sans-serif;
  }
  .page-menu .page-content {
    padding: 30px 40px;
  }

  .page-menu .header-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    position: sticky;
    top: 0;
    background: white;
    padding: 20px 0;
    z-index: 10;
    border-bottom: 1px solid #f0f0f0;
  }

  .page-menu .title {
    font-size: 40px;
    font-weight: 800;
    background: linear-gradient(90deg, #ffa83f, #ff5e25);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .page-menu .subtitle {
    font-size: 22px;
    color: #333;
  }
  .page-menu .subtitle strong {
    font-weight: 800;
    color: #000;
  }

  .page-menu .add-btn {
    background: linear-gradient(90deg, #ffa83f, #ff5e25);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(255, 94, 37, 0.25);
  }
  .page-menu .add-btn:active {
    transform: scale(0.97);
  }

  .page-menu .sheet-img-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }
  .page-menu .sheet-img img {
    width: 160px;
    height: 110px;
    object-fit: cover;
    border-radius: 14px;
    border: 1px solid #eee;
  }
  .page-menu .upload-box {
    flex: 1;
    border: 2px dashed #d1d5db;
    border-radius: 14px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 10px;
  }
  .page-menu .upload-box:hover {
    border-color: #ff5e25;
    background: #fff7f3;
  }
  .page-menu .upload-content {
    text-align: center;
  }
  .page-menu .upload-icon {
    font-size: 22px;
    margin-bottom: 6px;
  }
  .page-menu .upload-text {
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }
  .page-menu .upload-sub {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }

  .page-menu .menu-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .page-menu .menu-card {
    background: white;
    border-radius: 18px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    border: 1px solid #eee;
    min-height: 140px;
    transition: 0.2s;
  }
  .page-menu .menu-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }
  .page-menu .menu-left {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
  }
  .page-menu .menu-left img {
    width: 110px;
    height: 90px;
    object-fit: cover;
    border-radius: 12px;
  }
  .page-menu .menu-name {
    font-size: 18px;
    font-weight: 700;
    color: #000;
  }
  .page-menu .price {
    font-size: 15px;
    color: #666;
    margin-top: 4px;
  }
  .page-menu .menu-type-badge {
    display: inline-block;
    padding: 3px 10px;
    background: #fff3ed;
    color: #ff5e25;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    margin-top: 6px;
  }
  .page-menu .menu-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .page-menu .action-icons {
    display: flex;
    gap: 10px;
  }
  .page-menu .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid #ff5e25;
    background: white;
    cursor: pointer;
    font-size: 14px;
  }
  .page-menu .icon-btn:hover {
    background: #fff3ed;
  }

  .page-menu .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .page-menu .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .page-menu .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    transition: 0.3s;
    border-radius: 20px;
  }
  .page-menu .slider:before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  .page-menu input:checked + .slider {
    background: linear-gradient(90deg, #ffa83f, #ff5e25);
  }
  .page-menu input:checked + .slider:before {
    transform: translateX(18px);
  }

  .page-menu .bottom-sheet {
    position: fixed; /* ← FIX UTAMA: nempel ke viewport */
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 1000px;
    height: 95%;
    background: #f9fafb;
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -15px 50px rgba(0, 0, 0, 0.2);
    transition:
      transform 0.35s cubic-bezier(0.32, 0.72, 0, 1),
      visibility 0.35s;
    display: flex;
    flex-direction: column;
    z-index: 200;
    visibility: hidden;
  }

  .page-menu .bottom-sheet.open {
    transform: translateX(-50%) translateY(0);
    visibility: visible; /* ← FIX: visible saat open */
  }

  .page-menu .bottom-sheet.open {
    transform: translateX(-50%) translateY(0);
  }
  .page-menu .sheet-handle {
    width: 60px;
    height: 6px;
    background: #d1d5db;
    border-radius: 20px;
    margin: 12px auto;
  }
  .page-menu .sheet-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .page-menu .sheet-body h3 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 20px;
  }
  .page-menu .sheet-section {
    margin-bottom: 16px;
  }
  .page-menu .sheet-section label {
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 6px;
    display: block;
  }
  .page-menu .input-modern {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    background: #fff;
    font-size: 15px;
  }
  .page-menu .input-modern:focus {
    outline: none;
    border-color: #ff5e25;
    box-shadow: 0 0 0 3px rgba(255, 94, 37, 0.15);
  }
  .page-menu .row {
    display: flex;
    gap: 12px;
  }
  .page-menu .price-group {
    display: flex;
    align-items: center;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    background: #fff;
  }
  .page-menu .price-prefix {
    padding: 14px;
    background: #f3f4f6;
    font-weight: 600;
  }
  .page-menu .price-group input {
    border: none;
    padding: 14px;
    flex: 1;
    font-size: 15px;
    outline: none;
  }
  .page-menu .taste-row {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 8px;
  }
  .page-menu .taste-box {
    background: #fff;
    border-radius: 14px;
    padding: 10px 6px;
    flex: 1;
    text-align: center;
    border: 1px solid #eee;
  }
  .page-menu .taste-box span {
    font-size: 11px;
    color: #777;
    display: block;
    margin-bottom: 4px;
  }
  .page-menu .taste-box input {
    width: 100%;
    border: none;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    outline: none;
    background: transparent;
  }
  .page-menu .extra-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .page-menu .extra-header h4 {
    font-size: 16px;
    font-weight: 700;
  }
  .page-menu .icon-orange {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 2px solid #ff5e25;
    background: white;
    color: #ff5e25;
    font-size: 18px;
    cursor: pointer;
  }
  .page-menu .extra-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .page-menu .extra-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
  }
  .page-menu .extra-item-info {
    flex: 1;
  }
  .page-menu .extra-item-name {
    font-weight: 600;
    font-size: 14px;
  }
  .page-menu .extra-item-price {
    font-size: 12px;
    color: #666;
  }
  .page-menu .extra-item-remove {
    background: none;
    border: none;
    color: #dc2626;
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }
  .page-menu .btn-save {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    color: white;
    background: linear-gradient(90deg, #ffa83f, #ff5e25);
    cursor: pointer;
  }
  .page-menu .btn-save:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .page-menu .sheet-overlay {
    position: fixed; /* ← FIX: nempel ke viewport */
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
    visibility: hidden; /* ← FIX: hidden sempurna */
  }
  .page-menu .sheet-overlay.open {
    opacity: 1;
    pointer-events: all;
    visibility: visible; /* ← FIX: visible saat open */
  }
  .page-menu .loading-state,
  .page-menu .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .page-menu .loading-state i {
    font-size: 40px;
    animation: spinm 1s linear infinite;
    margin-bottom: 15px;
    display: block;
  }
  @keyframes spinm {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
  .page-menu .empty-state i {
    font-size: 64px;
    opacity: 0.3;
    margin-bottom: 15px;
    display: block;
  }
</style>

<div class="page-menu">
  <div class="page-content">
    <div class="header-section">
      <div>
        <div class="title">Chick on Cup</div>
        <div class="subtitle"><strong>Menu</strong> Kamu</div>
      </div>
      <button class="add-btn" id="addMenuBtn">＋ Tambah</button>
    </div>

    <div class="menu-container" id="menuContainer">
      <div class="loading-state">
        <i class="fas fa-spinner"></i>
        <p>Memuat menu...</p>
      </div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>

  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <h3 id="sheet-title">Tambah Menu</h3>

      <div class="sheet-img-row">
        <div class="sheet-img">
          <img id="preview-image" src="images/assets/menu.png" />
        </div>
        <label class="upload-box">
          <input type="file" id="image-input" accept="image/*" hidden />
          <div class="upload-content">
            <div class="upload-icon">⬆</div>
            <div class="upload-text">Choose a file or drag & drop</div>
            <div class="upload-sub">JPEG, PNG, up to 2 MB</div>
          </div>
        </label>
      </div>

      <div class="sheet-section">
        <label>Nama Menu *</label>
        <input
          type="text"
          id="sheet-name"
          class="input-modern"
          maxlength="45"
          placeholder="Contoh: Nasi Goreng Spesial"
        />
      </div>

      <div class="row">
        <div class="sheet-section" style="flex: 1">
          <label>Harga *</label>
          <div class="price-group">
            <div class="price-prefix">Rp</div>
            <input
              type="number"
              id="sheet-price-input"
              min="0"
              placeholder="0"
            />
          </div>
        </div>
        <div class="sheet-section" style="flex: 1">
          <label>Kategori *</label>
          <select id="sheet-category" class="input-modern">
            <option value="FOOD">Makanan</option>
            <option value="DRINK">Minuman</option>
            <option value="SNACK">Snack</option>
            <option value="PRASMANAN">Prasmanan</option>
          </select>
        </div>
      </div>

      <div class="sheet-section">
        <label>Estimasi Waktu (menit) *</label>
        <input
          type="number"
          id="sheet-estimated-time"
          class="input-modern"
          min="1"
          value="15"
        />
      </div>

      <div class="sheet-section">
        <label>Level Rasa (opsional, 0-10)</label>
        <div class="taste-row">
          <div class="taste-box">
            <span>Manis</span
            ><input type="number" id="taste-manis" min="0" max="10" value="0" />
          </div>
          <div class="taste-box">
            <span>Pahit</span
            ><input type="number" id="taste-pahit" min="0" max="10" value="0" />
          </div>
          <div class="taste-box">
            <span>Asin</span
            ><input type="number" id="taste-asin" min="0" max="10" value="0" />
          </div>
          <div class="taste-box">
            <span>Asam</span
            ><input type="number" id="taste-asam" min="0" max="10" value="0" />
          </div>
          <div class="taste-box">
            <span>Pedas</span
            ><input type="number" id="taste-pedas" min="0" max="10" value="0" />
          </div>
        </div>
      </div>

      <div class="extra-header">
        <h4>Menu Tambahan (Addons)</h4>
        <button type="button" class="icon-orange" onclick="showAddAddonForm()">
          ＋
        </button>
      </div>
      <div class="extra-list" id="addonList"></div>

      <div
        id="addonForm"
        style="
          display: none;
          margin-top: 12px;
          padding: 14px;
          background: white;
          border-radius: 12px;
          border: 1px solid #e5e7eb;
        "
      >
        <div class="row">
          <div class="sheet-section" style="flex: 2">
            <label>Pilih Menu Lain sebagai Addon</label>
            <select class="input-modern" id="addon-select">
              <option value="">-- Pilih menu --</option>
            </select>
          </div>
          <div class="sheet-section" style="flex: 1">
            <label>Harga Tambahan</label>
            <div class="price-group">
              <div class="price-prefix">Rp</div>
              <input type="number" id="addon-price" min="0" placeholder="0" />
            </div>
          </div>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px">
          <button
            type="button"
            class="btn-save"
            style="flex: 1; padding: 10px; font-size: 14px"
            onclick="confirmAddAddon()"
          >
            Tambah
          </button>
          <button
            type="button"
            class="icon-orange"
            style="width: auto; padding: 0 16px"
            onclick="hideAddAddonForm()"
          >
            Batal
          </button>
        </div>
      </div>
    </div>

    <div style="padding: 20px">
      <button class="btn-save" id="saveMenuBtn" onclick="saveMenu()">
        Simpan
      </button>
    </div>
  </div>
</div>

<script>
  // ✅ Auth check — redirect path disesuaikan
  if (typeof requireAuth === "function" && !requireAuth()) {
    window.location.href = "pages/login.html";
  }

  let mode = "add";
  let currentMenuId = null;
  let myMenus = [];
  let allFoods = [];
  let selectedAddons = [];

  // ✅ INIT LANGSUNG (tanpa DOMContentLoaded karena DOM udah loaded saat inject)
  fetchMyMenus();
  setupEventListeners();

  async function fetchMyMenus() {
    const container = document.getElementById("menuContainer");
    if (!container) return;

    container.innerHTML =
      '<div class="loading-state"><i class="fas fa-spinner"></i><p>Memuat menu...</p></div>';

    try {
      const vendor = getVendorData();
      console.log("[DEBUG] Vendor data:", vendor);

      if (!vendor || !vendor.id) {
        throw new Error("Data vendor tidak ditemukan. Silakan login ulang.");
      }

      const url = `${API_CONFIG.ENDPOINTS.FOODS_BY_VENDOR}/${vendor.id}/foods?per_page=100`;
      console.log("[DEBUG] Fetch URL:", API_CONFIG.BASE_URL + url);

      const { response, data } = await fetchWithAuth(url);

      console.log("[DEBUG] Response status:", response.status);
      console.log("[DEBUG] Response data:", data);

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}: ${data.message || response.statusText}`,
        );
      }

      if (!data.success) {
        throw new Error(data.message || "Gagal mengambil data menu");
      }

      // ✅ Handle berbagai format response dari backend
      let menus = [];

      if (Array.isArray(data.data)) {
        // Format 1: { success: true, data: [...] }
        menus = data.data;
      } else if (data.data && Array.isArray(data.data.data)) {
        // Format 2 (Laravel paginate): { success: true, data: { data: [...], current_page: 1 } }
        menus = data.data.data;
      } else if (Array.isArray(data)) {
        // Format 3: langsung array tanpa wrapper
        menus = data;
      } else {
        console.error("[DEBUG] Unexpected response format:", data);
        throw new Error("Format response dari server tidak dikenali");
      }

      console.log(`[DEBUG] Loaded ${menus.length} menus`);

      myMenus = menus;
      renderMenus(myMenus);
    } catch (error) {
      console.error("[ERROR] fetchMyMenus:", error);
      container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Gagal memuat menu</h3>
        <p>${error.message}</p>
        <button onclick="fetchMyMenus()" style="margin-top:15px; padding:10px 20px; background:linear-gradient(90deg,#ffa83f,#ff5e25); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600;">
          🔄 Coba Lagi
        </button>
      </div>`;
    }
  }
  async function fetchAllFoods() {
    try {
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.FOODS}?per_page=500`,
      );
      if (response.ok && data.success) allFoods = data.data || [];
    } catch (e) {
      console.error(e);
    }
  }

  function renderMenus(menus) {
    const container = document.getElementById("menuContainer");
    if (!menus || menus.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-utensils"></i><h3>Belum ada menu</h3><p>Klik "Tambah" untuk menambahkan menu pertama</p></div>`;
      return;
    }
    container.innerHTML = "";
    menus.forEach((menu) => container.appendChild(createMenuCard(menu)));
  }

  function createMenuCard(menu) {
    const card = document.createElement("div");
    card.className = "menu-card";
    // ✅ Path gambar diperbaiki (tanpa ../)
    const imageUrl = menu.image
      ? `${API_CONFIG.BASE_URL.replace("/api", "")}/storage/${menu.image}`
      : "images/assets/menu.png";
    const priceFormatted = parseInt(menu.price).toLocaleString("id-ID");
    const typeLabels = {
      FOOD: "Makanan",
      DRINK: "Minuman",
      SNACK: "Snack",
      PRASMANAN: "Prasmanan",
    };
    card.innerHTML = `
      <div class="menu-left">
        <img src="${imageUrl}" alt="${menu.name}" onerror="this.src='images/assets/menu.png'" />
        <div class="menu-info">
          <div class="menu-name">${menu.name}</div>
          <div class="price">Rp ${priceFormatted}</div>
          <span class="menu-type-badge">${typeLabels[menu.type] || menu.type}</span>
        </div>
      </div>
      <div class="menu-right">
        <div class="action-icons">
          <button class="icon-btn edit" title="Edit">✏️</button>
          <button class="icon-btn delete" title="Hapus">🗑️</button>
        </div>
        <label class="switch"><input type="checkbox" ${menu.active ? "checked" : ""} /><span class="slider"></span></label>
      </div>`;
    card.querySelector(".edit").onclick = () => openEdit(menu);
    card.querySelector(".delete").onclick = () =>
      deleteMenu(menu.id, menu.name);
    card.querySelector('input[type="checkbox"]').onchange = (e) =>
      toggleActive(menu.id, e.target.checked);
    return card;
  }

  function setupEventListeners() {
    const addBtn = document.getElementById("addMenuBtn");
    if (addBtn) addBtn.onclick = openTambah;
    const imageInput = document.getElementById("image-input");
    if (imageInput) {
      imageInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast("Ukuran file maksimal 2 MB!", "error");
          this.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) =>
          (document.getElementById("preview-image").src = e.target.result);
        reader.readAsDataURL(file);
      });
    }
  }

  function openTambah() {
    mode = "add";
    currentMenuId = null;
    selectedAddons = [];
    document.getElementById("sheet-title").innerText = "Tambah Menu";
    document.getElementById("sheet-name").value = "";
    document.getElementById("sheet-price-input").value = "";
    document.getElementById("sheet-estimated-time").value = "15";
    document.getElementById("sheet-category").value = "FOOD";
    document.getElementById("preview-image").src = "images/assets/menu.png";
    document.getElementById("image-input").value = "";
    ["manis", "pahit", "asin", "asam", "pedas"].forEach(
      (t) => (document.getElementById(`taste-${t}`).value = "0"),
    );
    renderAddonList();
    openSheet();
  }

  async function openEdit(menu) {
    mode = "edit";
    currentMenuId = menu.id;
    selectedAddons = [];
    await fetchAllFoods();
    if (menu.addons && Array.isArray(menu.addons)) {
      selectedAddons = menu.addons.map((a) => ({
        addons_id: a.addon ? a.addon.id : a.id,
        name: a.addon ? a.addon.name : a.name,
        extra_price: a.pivot ? a.pivot.extra_price : a.extra_price || 0,
      }));
    }
    document.getElementById("sheet-title").innerText = "Edit Menu";
    document.getElementById("sheet-name").value = menu.name || "";
    document.getElementById("sheet-price-input").value = menu.price || "";
    document.getElementById("sheet-estimated-time").value =
      menu.estimated_time || 15;
    document.getElementById("sheet-category").value = menu.type || "FOOD";
    const imageUrl = menu.image
      ? `${API_CONFIG.BASE_URL.replace("/api", "")}/storage/${menu.image}`
      : "images/assets/menu.png";
    document.getElementById("preview-image").src = imageUrl;
    document.getElementById("image-input").value = "";
    document.getElementById("taste-manis").value = menu.Manis || 0;
    document.getElementById("taste-pahit").value = menu.Pahit || 0;
    document.getElementById("taste-asin").value = menu.Asin || 0;
    document.getElementById("taste-asam").value = menu.Asam || 0;
    document.getElementById("taste-pedas").value = menu.Pedas || 0;
    renderAddonList();
    openSheet();
  }

  function openSheet() {
    document.getElementById("bottom-sheet").classList.add("open");
    document.getElementById("sheet-overlay").classList.add("open");
  }
  function closeSheet() {
    document.getElementById("bottom-sheet").classList.remove("open");
    document.getElementById("sheet-overlay").classList.remove("open");
    hideAddAddonForm();
  }

  async function showAddAddonForm() {
    if (allFoods.length === 0) await fetchAllFoods();
    const select = document.getElementById("addon-select");
    select.innerHTML = '<option value="">-- Pilih menu --</option>';
    allFoods
      .filter((f) => {
        if (mode === "edit" && f.id === currentMenuId) return false;
        if (selectedAddons.some((a) => a.addons_id === f.id)) return false;
        return true;
      })
      .forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = f.name;
        select.appendChild(opt);
      });
    document.getElementById("addon-price").value = "";
    document.getElementById("addonForm").style.display = "block";
  }
  function hideAddAddonForm() {
    document.getElementById("addonForm").style.display = "none";
  }

  function confirmAddAddon() {
    const addons_id = parseInt(document.getElementById("addon-select").value);
    const extra_price =
      parseInt(document.getElementById("addon-price").value) || 0;
    if (!addons_id) {
      showToast("Pilih menu untuk addon!", "error");
      return;
    }
    const f = allFoods.find((x) => x.id === addons_id);
    if (!f) {
      showToast("Menu tidak ditemukan!", "error");
      return;
    }
    selectedAddons.push({ addons_id, name: f.name, extra_price });
    renderAddonList();
    hideAddAddonForm();
    showToast("Addon ditambahkan", "success");
  }
  function removeAddon(i) {
    selectedAddons.splice(i, 1);
    renderAddonList();
  }
  function renderAddonList() {
    const list = document.getElementById("addonList");
    if (selectedAddons.length === 0) {
      list.innerHTML =
        '<p style="color:#999; font-size:13px; text-align:center; padding:10px;">Belum ada addon</p>';
      return;
    }
    list.innerHTML = selectedAddons
      .map(
        (a, i) => `
      <div class="extra-item">
        <div class="extra-item-info">
          <div class="extra-item-name">${a.name}</div>
          <div class="extra-item-price">+ Rp ${(a.extra_price || 0).toLocaleString("id-ID")}</div>
        </div>
        <button class="extra-item-remove" onclick="removeAddon(${i})">✕</button>
      </div>`,
      )
      .join("");
  }

  async function saveMenu() {
    const name = document.getElementById("sheet-name").value.trim();
    const price = document.getElementById("sheet-price-input").value;
    const estimatedTime = document.getElementById("sheet-estimated-time").value;
    const category = document.getElementById("sheet-category").value;
    const imageInput = document.getElementById("image-input");
    const saveBtn = document.getElementById("saveMenuBtn");

    // Validasi
    if (!name) {
      showToast("Nama menu wajib diisi!", "error");
      return;
    }
    if (!price || price < 0) {
      showToast("Harga tidak valid!", "error");
      return;
    }
    if (!estimatedTime || estimatedTime < 1) {
      showToast("Estimasi waktu minimal 1 menit!", "error");
      return;
    }

    saveBtn.disabled = true;
    saveBtn.innerText = "Menyimpan...";

    try {
      const vendor = getVendorData();
      if (!vendor || !vendor.id) {
        showToast("Data vendor tidak ditemukan. Silakan login ulang.", "error");
        saveBtn.disabled = false;
        saveBtn.innerText = "Simpan";
        return;
      }

      const formData = new FormData();
      formData.append("vendor_id", vendor.id); // ✅ TAMBAHKAN INI!
      formData.append("name", name);
      formData.append("price", price);
      formData.append("type", category);
      formData.append("estimated_time", estimatedTime);
      formData.append("active", "1");

      ["Manis", "Pahit", "Asin", "Asam", "Pedas"].forEach((t) =>
        formData.append(
          t,
          document.getElementById(`taste-${t.toLowerCase()}`).value || "0",
        ),
      );

      if (imageInput.files[0]) {
        formData.append("image", imageInput.files[0]);
        console.log(
          "[DEBUG] Image file:",
          imageInput.files[0].name,
          imageInput.files[0].size,
          "bytes",
        );
      }

      let response, data;

      if (mode === "add") {
        console.log(
          "[DEBUG] POST ke:",
          API_CONFIG.BASE_URL + API_CONFIG.ENDPOINTS.FOOD_CREATE,
        );
        const r = await fetchWithAuth(API_CONFIG.ENDPOINTS.FOOD_CREATE, {
          method: "POST",
          body: formData,
        });
        response = r.response;
        data = r.data;
      } else {
        formData.append("_method", "PUT");
        const url = `${API_CONFIG.ENDPOINTS.FOOD_UPDATE}/${currentMenuId}`;
        console.log("[DEBUG] PUT ke:", API_CONFIG.BASE_URL + url);
        const r = await fetchWithAuth(url, { method: "POST", body: formData });
        response = r.response;
        data = r.data;
      }

      console.log("[DEBUG] Save response data:", JSON.stringify(data, null, 2));
      console.log("[DEBUG] Full response object:", data);

      // ✅ Jika ada errors, tampilkan detailnya
      if (data.errors) {
        console.error("[DEBUG] Validation errors detail:");
        Object.entries(data.errors).forEach(([field, messages]) => {
          console.error(`  ❌ ${field}:`, messages);
        });
      }

      // ✅ Handle success - berbagai format response
      if (
        response.ok &&
        (data.success || response.status === 200 || response.status === 201)
      ) {
        // Coba ambil ID menu yang baru dibuat
        let newFoodId = null;

        if (data.data && data.data.id) {
          newFoodId = data.data.id;
        } else if (data.id) {
          newFoodId = data.id;
        } else if (data.data && typeof data.data === "object") {
          newFoodId =
            Object.values(data.data).find((v) => typeof v === "number") ||
            currentMenuId;
        } else {
          newFoodId = currentMenuId;
        }

        console.log("[DEBUG] New food ID:", newFoodId);

        // ✅ Save addons jika ada
        if (selectedAddons.length > 0 && newFoodId) {
          console.log(`[DEBUG] Saving ${selectedAddons.length} addons...`);
          for (const addon of selectedAddons) {
            try {
              const addonUrl = `${API_CONFIG.ENDPOINTS.FOOD_CREATE}/${newFoodId}/addons`;
              console.log("[DEBUG] Addon POST ke:", addonUrl);
              await fetchWithAuth(addonUrl, {
                method: "POST",
                body: JSON.stringify({
                  addons_id: addon.addons_id,
                  extra_price: addon.extra_price,
                }),
              });
            } catch (e) {
              console.error("[ERROR] Addon save failed:", e);
            }
          }
        }

        const msg =
          mode === "add"
            ? "✅ Menu berhasil ditambahkan!"
            : "✅ Menu berhasil diupdate!";
        showToast(msg, "success");

        // ✅ Refresh list menu
        console.log("[DEBUG] Refreshing menu list...");
        await fetchMyMenus();

        // ✅ Close sheet
        closeSheet();
      } else {
        console.error("[ERROR] Save failed:", JSON.stringify(data, null, 2));
        console.error("[ERROR] Full data object:", data);

        // ✅ Handle Laravel validation errors (422)
        if (response.status === 422 && data.errors) {
          // Format: { errors: { field: ["message1", "message2"] } }
          const errorMessages = Object.entries(data.errors)
            .map(
              ([field, messages]) =>
                `• ${field}: ${Array.isArray(messages) ? messages.join(", ") : messages}`,
            )
            .join("\n");

          const fullMessage = `Validasi gagal:\n${errorMessages}`;
          console.error("[ERROR] Validation errors:\n" + errorMessages);
          showToast(fullMessage, "error");
        } else if (data.errors) {
          const errorMessages = Object.values(data.errors).flat().join("\n");
          showToast(errorMessages, "error");
        } else {
          showToast(
            data.message || `Gagal menyimpan menu (HTTP ${response.status})`,
            "error",
          );
        }
      }
    } catch (e) {
      console.error("[ERROR] saveMenu exception:", e);
      showToast(`Terjadi kesalahan: ${e.message}`, "error");
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerText = "Simpan";
    }
  }

  async function deleteMenu(id, name) {
    if (!confirm(`Yakin ingin menghapus menu "${name}"?`)) return;
    try {
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.FOOD_DELETE}/${id}`,
        { method: "DELETE" },
      );
      if (response.ok && data.success) {
        showToast("Menu berhasil dihapus!", "success");
        await fetchMyMenus();
      } else if (response.status === 409)
        showToast("Menu masih ada di pesanan", "error");
      else showToast(data.message || "Gagal menghapus", "error");
    } catch (e) {
      console.error(e);
      showToast("Terjadi kesalahan.", "error");
    }
  }

  async function toggleActive(id, active) {
    try {
      const formData = new FormData();
      formData.append("active", active ? "1" : "0");
      formData.append("_method", "PUT");
      const { response, data } = await fetchWithAuth(
        `${API_CONFIG.ENDPOINTS.FOOD_UPDATE}/${id}`,
        { method: "POST", body: formData },
      );
      if (response.ok && data.success)
        showToast(active ? "Menu diaktifkan" : "Menu dinonaktifkan", "success");
      else {
        showToast(data.message || "Gagal mengubah status", "error");
        await fetchMyMenus();
      }
    } catch (e) {
      console.error(e);
      showToast("Terjadi kesalahan", "error");
      await fetchMyMenus();
    }
  }
</script>
