<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Chick on Cup</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        background: #f5f5f5;
      }

      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        background: #fff;
        padding: 20px;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      }

      .nav {
        display: block;
        padding: 12px;
        margin: 8px 0;
        cursor: pointer;
        border-radius: 10px;
        background: transparent;
      }

      .nav.active {
        background: #ff5e25;
        color: white;
      }

      #content {
        margin-left: 260px;
        width: 100%;
        padding: 20px;
      }

      .loading-container {
        text-align: center;
        padding: 40px;
      }
    </style>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="sidebar">
      <button class="nav active" onclick="loadPage('pages/order.html', this)">
        📄 Pesanan
      </button>

      <button class="nav" onclick="loadPage('pages/menu.html', this)">
        📖 Menu
      </button>

      <button class="nav" onclick="logout()">🚪 Logout</button>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div class="loading-container">Loading...</div>
    </div>

    <script src="js/config.js"></script>

    <script>
      // AUTH CHECK (ONLY HERE)
      if (!requireAuth()) {
        window.location.href = "/pages/login.html";
      }

      async function loadPage(page, el) {
        document
          .querySelectorAll(".nav")
          .forEach((n) => n.classList.remove("active"));
        if (el) el.classList.add("active");

        const content = document.getElementById("content");

        content.innerHTML = "Loading...";

        const res = await fetch(page);
        let html = await res.text();

        html = html
          .replace(/<!DOCTYPE[^>]*>/gi, "")
          .replace(/<\/?html[^>]*>/gi, "")
          .replace(/<\/?head[^>]*>/gi, "")
          .replace(/<\/?body[^>]*>/gi, "");

        content.innerHTML = html;

        // run scripts
        content.querySelectorAll("script").forEach((old) => {
          const s = document.createElement("script");
          s.text = old.textContent;
          old.replaceWith(s);
        });
      }

      function logout() {
        removeToken();
        window.location.href = "/pages/login.html";
      }

      // default page
      loadPage("pages/order.html", document.querySelector(".nav"));
    </script>
  </body>
</html>
